name: Build Windows installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install the Tauri CLI
        run: npm install

      - name: Build and publish the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Taskromancer v__VERSION__'
          releaseBody: 'Download Taskromancer_x.x.x_x64-setup.exe below and run it. If Windows shows “Windows protected your PC”, click More info, then Run anyway.'
          releaseDraft: false
          prerelease: false

      - name: Keep the installers as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: taskromancer-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
