<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f1220">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskromancer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  color-scheme:dark;
  --night:#0f1220; --stone:#1a1f2e; --stone2:#222839; --stone3:#2b3247;
  --edge:#363e57; --edge-hi:#4d5778; --abyss:#080a12;
  --text:#dfe3ee; --muted:#8d95ad; --dim:#5d6580;
  --soul:#6ee7a8; --soul-dim:#2f6b52; --arcane:#7aa2ff; --bone:#d9d4c3;
  --ok:#6fcf8e; --near:#e3b25a; --over:#e0605e;
  --f-px:"Pixelify Sans","Rubik",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:var(--night)}
body{margin:0;min-height:100%;color:var(--text);font:14px/1.45 var(--f-ui);font-variant-numeric:tabular-nums;background-attachment:fixed;background-repeat:no-repeat;
  background:radial-gradient(1200px 500px at 20% -10%,var(--glow1) 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,var(--glow2) 0%,transparent 60%) fixed,var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--arcane)}
:focus-visible{outline:2px solid var(--soul);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--soul) 33%,transparent)}

/* ---------- pixel panels ---------- */
.panel{position:relative;background:linear-gradient(180deg,var(--stone2),var(--stone));border:2px solid var(--abyss);
  box-shadow:inset 0 0 0 2px var(--edge),inset 0 4px 0 0 #ffffff0d,0 4px 0 0 #0006;padding:14px}
.panel::before,.panel::after{content:"";position:absolute;width:6px;height:6px;background:var(--edge-hi);box-shadow:0 0 0 2px var(--abyss);top:6px}
.panel::before{left:6px}.panel::after{right:6px}
.plate{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}
.plate h2{font:500 18px/1 var(--f-px);margin:0;letter-spacing:.02em;color:var(--bone)}
.plate .sub{font-size:12px;color:var(--muted)}
.plate .right{margin-left:auto;display:flex;gap:6px;align-items:center}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:2px solid var(--abyss);background:var(--topbar);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--abyss)}
.brand{display:flex;align-items:center;gap:10px;font:600 20px/1 var(--f-px);color:var(--bone)}
.brand svg{width:28px;height:28px}
.today{font:400 15px var(--f-px);color:var(--muted)}
.top .spacer{flex:1}
.sync{font-size:12px;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;background:var(--stone3);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge-hi),inset 0 2px 0 #ffffff14;font-weight:500;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--stone-h)}
.btn:active{transform:translateY(1px)}
.btn.soul{background:var(--soul-btn);box-shadow:inset 0 0 0 1px var(--soul),inset 0 2px 0 #ffffff1a;color:var(--soul-ink)}
.btn.soul:hover{background:var(--soul-btn-h)}
.btn.danger{color:#ffb3b1}
.btn.sm{padding:4px 9px;font-size:13px}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{display:inline-grid;place-items:center;width:28px;height:28px;color:var(--muted);border:1px solid transparent}
.ib:hover{color:var(--text);background:var(--stone3);border-color:var(--edge)}
.ib svg{width:15px;height:15px}
.field{background:var(--field);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);padding:7px 10px;min-width:0;color:var(--text)}
.field:focus{outline:none;box-shadow:inset 0 0 0 1px var(--soul)}
.field::placeholder{color:var(--dim)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:var(--lw,400px) 22px minmax(0,1fr);gap:0;padding:18px 20px 60px;max-width:1440px;margin:0 auto;align-items:start}
.left{display:flex;flex-direction:column;gap:18px;position:sticky;top:72px}

/* ---------- ritual (timer) ---------- */
.scene{position:relative;margin:-4px -4px 12px;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden;background:#0a0d1a}
.scene svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.scene .caption{position:absolute;left:6px;top:5px;max-width:calc(100% - 12px);padding:1px 6px;background:rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 12px var(--f-px);color:#ece8df;text-shadow:0 1px 0 #000}
.floaty{position:absolute;right:10px;top:8px;font:600 13px var(--f-num);color:var(--soul);text-shadow:0 0 6px color-mix(in srgb,var(--soul) 67%,transparent);animation:floaty 1.6s ease-out forwards;pointer-events:none}
@keyframes floaty{from{opacity:0;transform:translateY(8px)}15%{opacity:1}to{opacity:0;transform:translateY(-16px)}}
.sk{animation:march 19s linear infinite}
.wheel{transform-box:fill-box;transform-origin:center}
.st-running .wheel{animation:spin 2.4s steps(16) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sk .bob{animation:bob .5s steps(2) infinite}
@keyframes march{0%{transform:translateX(0);opacity:0}4%{opacity:1}95%{opacity:1}100%{transform:translateX(var(--dx));opacity:0}}
@keyframes bob{50%{transform:translateY(-1px)}}
.flame{animation:flicker .35s steps(2) infinite}
@keyframes flicker{50%{transform:translateY(-1px);opacity:.75}}
.bubbles{opacity:.25}
.st-running .bubbles{opacity:1;animation:flicker .5s steps(2) infinite}
.st-paused .sk,.st-paused .sk .bob,.st-paused .flame,.st-idle .sk,.st-idle .sk .bob{animation-play-state:paused}
.rest .orb{fill:#9aa7b8}
#ritual.rest .digits{color:var(--rest-ink);text-shadow:0 3px 0 #000,0 0 18px #e8954e40}
.restnote{margin-top:6px;font-size:12px;color:var(--rest-ink);text-align:center}
.st-idle .flame{opacity:.55}
.win{fill:#e3b25a}
.st-running .win{animation:winblink 1.2s steps(2) infinite}
@keyframes winblink{50%{fill:#7a5b22}}
.orb{transition:fill .3s}
.st-running .orb{fill:#9dffc7}

.clock{display:flex;flex-direction:column;align-items:center;gap:4px}
.digits{font:700 50px/1 var(--f-num);letter-spacing:-.01em;color:var(--bone);text-shadow:0 3px 0 #000}
.st-running .digits{color:var(--soul-ink);text-shadow:0 3px 0 #000,0 0 18px color-mix(in srgb,var(--soul) 33%,transparent)}
.status{font-size:12px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin:14px 0 12px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;background:var(--stone3);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge-hi),inset 0 3px 0 #ffffff14,0 3px 0 #0008;font:500 14px var(--f-px)}
.ctl:hover{background:var(--stone-h)}
.ctl:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--edge-hi),0 1px 0 #0008}
.ctl svg{width:22px;height:22px;shape-rendering:crispEdges}
.ctl.main{background:var(--soul-btn);box-shadow:inset 0 0 0 1px var(--soul),inset 0 3px 0 #ffffff1a,0 3px 0 #0008;color:var(--soul-ink)}
.ctl.main:hover{background:var(--soul-btn-h)}
.ctl small{font:400 11px var(--f-ui);color:var(--muted)}
.ctl[disabled]{opacity:.4;pointer-events:none}
.focusline{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--field);border:1px solid var(--edge);font-size:13px;min-height:38px}
.focusline .lbl{color:var(--muted)}
.focusline b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soul-ink)}
.focusline.none b{color:var(--dim);font-weight:400}

/* ---------- harvest ---------- */
.chunks{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;margin-bottom:10px}
.chunk{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 6px 6px 8px;background:var(--field);border:1px solid var(--edge)}
.chunk.sel{border-color:var(--soul);background:var(--soul-bg)}
.chunk .dur{font:600 15px var(--f-num)}
.chunk .when{font-size:12px;color:var(--muted);display:block}
.box{width:18px;height:18px;border:2px solid var(--edge-hi);background:var(--sink);display:grid;place-items:center;color:transparent}
.box svg{width:12px;height:12px}
.sel .box,.box.on{background:var(--soul);border-color:var(--soul);color:var(--soul-dark)}
.harvest-foot{display:flex;gap:8px;flex-wrap:wrap}
.empty-note{color:var(--muted);font-size:13px;padding:6px 2px 2px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin-bottom:-2px;position:relative;z-index:1}
.tab{font:500 16px var(--f-px);padding:9px 16px 8px;color:var(--muted);background:var(--stone);border:2px solid var(--abyss);border-bottom:0;box-shadow:inset 0 0 0 1px var(--edge)}
.tab[aria-selected="true"]{color:var(--bone);background:var(--stone2);padding-bottom:10px}
.tab .n{font:400 12px var(--f-ui);color:var(--dim);margin-left:6px}

/* ---------- board ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{flex:1;min-width:160px}
.cols{display:grid;grid-template-columns:22px minmax(0,1fr) 64px 132px 96px 92px;gap:10px;padding:0 10px 6px 12px;font-size:12px;color:var(--dim)}
.cols span:nth-child(n+3){text-align:right}
.project{margin-bottom:14px;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);background:var(--card)}
.p-head{display:grid;grid-template-columns:22px minmax(0,1fr) 64px 132px 96px 92px;gap:10px;align-items:center;padding:10px 10px 10px 12px;background:linear-gradient(180deg,var(--head1),var(--card2));border-bottom:2px solid var(--abyss)}
.p-name{font:500 16px var(--f-px);color:var(--bone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.p-head .chev svg{width:16px;height:16px;transition:transform .15s}
.project.collapsed .p-head .chev svg{transform:rotate(-90deg)}
.num{text-align:right;white-space:nowrap;font:500 13.5px var(--f-num)}
.num.today{color:var(--soul)}
.num.today.zero{color:var(--dim)}
.est{text-align:right;font-size:12px;white-space:nowrap}
.est.ok{color:var(--ok)}.est.near{color:var(--near)}.est.over{color:var(--over)}.est.none{color:var(--dim)}
.acts{display:flex;justify-content:flex-end;gap:2px}
.q{position:relative}
.q-row{display:grid;grid-template-columns:22px minmax(0,1fr) 64px 132px 96px 92px;gap:10px;align-items:center;padding:6px 10px 6px 12px;border-bottom:1px solid #ffffff08;cursor:pointer;position:relative}
.q-row:hover{background:#ffffff06}
.q.child>.q-row{padding-left:40px;grid-template-columns:22px minmax(0,1fr) 64px 132px 96px 92px}
.q.child>.q-row .t{font-size:13.5px}
.q.child>.q-row::before{content:"";position:absolute;left:22px;top:0;bottom:50%;width:10px;border-left:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.t{display:flex;align-items:center;gap:8px;min-width:0}
.t span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--edge);padding:0 5px;white-space:nowrap}
.q.done>.q-row .name{color:var(--dim);text-decoration:line-through}
.q.done>.q-row .num{color:var(--dim)}
.q.focus>.q-row{background:var(--soul-bg);box-shadow:inset 0 0 0 1px var(--soul);animation:soulglow 2.2s ease-in-out infinite}
@keyframes soulglow{50%{box-shadow:inset 0 0 0 1px var(--soul),inset 0 0 18px color-mix(in srgb,var(--soul) 20%,transparent)}}
.q.focus>.q-row .name{color:var(--soul-ink)}
.q.focus>.q-row.tinted .name{color:var(--qc)}
.flamemark{width:12px;height:14px;flex:none;display:none}
.q.focus>.q-row .flamemark{display:block;animation:flicker .4s steps(2) infinite}
.qbar{grid-column:2/-1;height:3px;background:#ffffff0d;margin-top:2px}
.qbar i{display:block;height:100%}
.qbar.ok i{background:var(--ok)}.qbar.near i{background:var(--near)}.qbar.over i{background:var(--over)}
.t-col{display:flex;flex-direction:column;min-width:0}
.q-row[draggable="true"]{cursor:grab}
.q.dragging{opacity:.4}
.edit{padding:12px 14px 14px 40px;background:var(--well);border-bottom:1px solid var(--edge);display:grid;gap:10px}
.q.child .edit{padding-left:64px}
.edit .row{display:grid;grid-template-columns:2fr 1fr 2fr;gap:10px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.edit .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edit .foot form{display:flex;gap:6px;flex:1;min-width:220px}
.edit .foot form .field{flex:1}
.add-q{display:flex;gap:8px;padding:8px 10px 10px 40px}
.add-q .field{flex:1;padding:6px 10px}
.empty{border:2px dashed var(--edge);padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;font:500 17px var(--f-px);color:var(--bone);margin-bottom:6px}
.empty .btns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* crypt */
.crypt{margin-top:18px;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--frost-dim);background:repeating-linear-gradient(45deg,var(--crypt1) 0 8px,var(--crypt2) 8px 16px)}
.crypt-head{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:left}
.crypt-head b{font:500 16px var(--f-px);color:var(--frost)}
.crypt-head span{font-size:12px;color:var(--muted)}
.crypt-head svg{width:16px;height:16px;color:var(--frost)}
.crypt.drop{box-shadow:inset 0 0 0 2px var(--frost),0 0 20px color-mix(in srgb,var(--frost) 27%,transparent)}
.board-drop{outline:2px dashed var(--soul);outline-offset:4px}
.frozen{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid #ffffff0a;color:var(--frost)}
.frozen small{color:var(--dim);margin-left:6px}
.frozen[draggable="true"]{cursor:grab}

/* ---------- campaigns ---------- */
.goal-add{display:grid;grid-template-columns:64px 1fr 160px auto;gap:8px;margin-bottom:12px}
.goal-add select{font-size:18px;text-align:center}
.goals{display:flex;flex-direction:column;gap:10px}
.bar{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:50px;padding:0 14px;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);background:repeating-linear-gradient(135deg,var(--card) 0 8px,var(--well) 8px 16px);overflow:hidden;text-align:left}
.bar:hover{box-shadow:inset 0 0 0 1px var(--edge-hi)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--fill);transition:width .4s,background .4s;box-shadow:inset 0 3px 0 #ffffff26,inset 0 -3px 0 #0003}
.bar-fill::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:#ffffff66}
.bar>*:not(.bar-fill){position:relative}
.bar-icon{font-size:20px}
.bar-title{flex:1;min-width:0;font:500 16px var(--f-px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #000a}
.bar-meta{display:flex;gap:12px;align-items:center;font-size:13px;text-shadow:0 1px 2px #000;white-space:nowrap}
.bar-meta svg{width:14px;height:14px}
.goal.over .bar{box-shadow:inset 0 0 0 1px var(--over)}
.goal.complete .bar{box-shadow:inset 0 0 0 1px var(--ok)}
.goal .gpanel{border:2px solid var(--abyss);border-top:0;box-shadow:inset 0 0 0 1px var(--edge);background:var(--well);margin:0 8px;padding:14px;display:grid;gap:12px}
.ci{display:flex;align-items:center;gap:10px;padding:4px}
.ci:hover{background:#ffffff06}
.ci span{flex:1}
.ci.done span{color:var(--dim);text-decoration:line-through}
.ci .ib{opacity:0}.ci:hover .ib,.ci .ib:focus-visible{opacity:1}
.inline{display:flex;gap:8px}.inline .field{flex:1}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.grid4 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge)}
.seg button{padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--stone3);color:var(--text)}
.icons{display:flex;gap:3px;flex-wrap:wrap}
.icons button{width:32px;height:32px;font-size:17px;border:1px solid transparent}
.icons button[aria-pressed="true"]{border-color:var(--soul);background:var(--soul-bg)}
.swatches{display:flex;gap:6px;align-items:center}
.swatches button{width:22px;height:22px;border:2px solid var(--abyss)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--text)}
input[type=color]{width:30px;height:26px;border:1px solid var(--edge);background:none;padding:1px}
.explain{font-size:13px;color:var(--muted);margin:0}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:60px;height:6px;background:linear-gradient(90deg,hsl(0 68% 46%),hsl(55 75% 48%),hsl(130 55% 42%))}
.chips{display:flex;gap:4px}
.chips button{min-width:32px;height:30px;padding:0 9px;border:1px solid var(--edge);color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--soul);color:var(--text)}

/* ---------- allocator dialog ---------- */
dialog{background:linear-gradient(180deg,var(--stone2),var(--stone));color:var(--text);border:2px solid var(--abyss);box-shadow:inset 0 0 0 2px var(--edge),0 20px 60px #000c;padding:20px;width:min(760px,94vw);max-height:90vh}
dialog::backdrop{background:#03050ccc}
dialog h2{font:500 20px var(--f-px);margin:0;color:var(--bone)}
.dlg-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.dlg-head .tot{margin-left:auto;font:500 16px var(--f-px);color:var(--soul)}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.hint kbd,.keys kbd{font:12px var(--f-ui);background:var(--stone3);border:1px solid var(--edge);padding:0 5px}
.strip{position:relative;height:64px;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);background:var(--sink);margin:6px 0 4px;user-select:none;touch-action:none;cursor:copy}
.sg{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 8px;overflow:hidden;white-space:nowrap;border-right:2px solid var(--abyss);cursor:pointer}
.sg b{font:700 15px/1.1 var(--f-num);text-shadow:0 2px 0 #0008}
.sg small{font-size:11px;opacity:.9;overflow:hidden;text-overflow:ellipsis}
.sg.un{background:repeating-linear-gradient(135deg,#232838 0 6px,#1b2030 6px 12px)!important;color:var(--muted)}
.sg.active{box-shadow:inset 0 0 0 2px #fff}
.hd{position:absolute;top:-8px;bottom:-8px;width:16px;margin-left:-8px;cursor:ew-resize;z-index:2;display:flex;justify-content:center}
.hd::before{content:"";width:4px;background:var(--bone);box-shadow:0 0 0 2px var(--abyss)}
.hd:hover::before,.hd.drag::before{background:#fff}
.hd .x{position:absolute;top:-14px;width:16px;height:16px;background:var(--over);color:#fff;font-size:11px;line-height:16px;text-align:center;display:none;border:1px solid var(--abyss)}
.hd:hover .x{display:block}
.hd .tip{position:absolute;bottom:-20px;font:500 12px var(--f-px);color:var(--bone);white-space:nowrap;display:none}
.hd.drag .tip,.hd:hover .tip{display:block}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:14px}
.parts{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.part{display:grid;grid-template-columns:14px 64px 80px 1fr auto;gap:8px;align-items:center}
.part .sw{width:14px;height:14px;border:2px solid var(--abyss)}
.part .lab{font-size:12.5px;color:var(--muted)}
.part input.min{width:80px;text-align:right}
.part.active{outline:1px solid var(--edge-hi);outline-offset:3px}
.dlg-foot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.dlg-foot .sum{flex:1;font-size:13px;color:var(--muted);min-width:200px}
.dlg-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlg-list .btn{justify-content:flex-start}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:16px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:14px;background:var(--stone2);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--soul),0 10px 30px #000a;padding:10px 14px;z-index:60;font-size:14px}
.toast.show{display:flex}
.toast button{font:500 14px var(--f-px);color:var(--soul)}

/* ---------- v11: layout, dialogs, note images ---------- */
.layout.swap{grid-template-columns:minmax(0,1fr) 22px var(--lw,400px)}
.layout.swap .left{order:3}.layout.swap .colsplit{order:2}.layout.swap .right{order:1}
.colsplit{align-self:stretch;cursor:col-resize;position:relative;touch-action:none;min-height:200px}
.colsplit::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--edge);opacity:0;transition:opacity .15s}
.colsplit:hover::before,.colsplit.active::before{opacity:1;background:var(--soul)}
.drag-h{cursor:grab}
.fold svg{transition:transform .15s}
.fold[aria-expanded="false"] svg{transform:rotate(-90deg)}
.dlg-x{position:sticky;top:0;float:right;margin:-8px -8px 4px 12px;width:32px;height:32px;font-size:22px;line-height:1;color:var(--muted);background:var(--stone2);border:1px solid var(--edge);z-index:3}
.dlg-x:hover{color:var(--text);border-color:var(--edge-hi)}
.imgtools{position:absolute;z-index:70;display:flex;gap:4px;padding:4px;background:var(--stone2);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge-hi),0 6px 18px #0009}
.imgtools button{display:flex;align-items:center;gap:6px;padding:5px 9px;font-size:12.5px;color:var(--text)}
.imgtools button:hover{background:var(--stone3)}
.imgtools .danger{color:#ffb3b1}
.imgtools svg{width:13px;height:13px}
.rich img.img-sel{outline:2px solid var(--soul);outline-offset:2px}

/* ---------- v10: desktop ---------- */
.desk-only{display:none!important}
body.desk .desk-only{display:inline-grid!important}
.linked{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--arcane);margin-left:8px;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.linked svg{width:11px;height:11px;flex:none}
.imgrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--edge)}
.imgrow .sub{font-size:12.5px;color:var(--muted);max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.refimg{margin-top:10px;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);background:var(--well);padding:6px}
.refimg img{display:block;max-width:100%;max-height:420px;margin:0 auto}
.refbar{display:flex;gap:6px;align-items:center;margin-top:6px}
.refbar .sub{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:240px}

/* ---------- v9: phrases ---------- */
.top .quote{flex:1;min-width:0;padding:4px 10px;text-align:center;font:400 14px var(--f-px);color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.top .quote:hover{opacity:1;color:var(--soul)}
.top .quote.empty{color:var(--dim)}
.qm{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;margin-top:12px}
.qlists{display:flex;flex-direction:column;gap:2px}
.qlists button{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;text-align:left;color:var(--muted);border:1px solid transparent}
.qlists button:hover{background:var(--stone3);color:var(--text)}
.qlists button[aria-pressed="true"]{border-color:var(--soul);color:var(--text);background:var(--soul-bg)}
.qlists small{color:var(--dim)}
.qlists .qnew{justify-content:flex-start;align-items:center;margin-top:4px;border:1px dashed var(--edge)}
.qlists .qnew svg{width:13px;height:13px}
.qedit{display:flex;flex-direction:column;gap:8px}
.qedit textarea{font:13.5px/1.5 var(--f-ui);resize:vertical}
@media (max-width:640px){ .top .quote{display:none} .qm{grid-template-columns:1fr} }

/* ---------- v8: themes, tab visibility ---------- */
dialog h3.dh{font:500 15px var(--f-px);color:var(--bone);margin:18px 0 8px}
dialog .hint{margin:0 0 8px}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.thcard{display:flex;flex-direction:column;gap:4px;padding:10px;text-align:left;background:var(--tb);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--te);color:var(--tt)}
.thcard:hover{box-shadow:inset 0 0 0 1px var(--ta)}
.thcard[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ta)}
.thcard b{font:500 15px var(--f-px)}
.thcard small{font-size:11.5px;opacity:.75;line-height:1.35}
.thsw{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.thsw svg{width:18px;height:18px;margin-right:4px}
.thsw i{width:16px;height:10px;background:var(--tp);border:1px solid var(--te)}
.thsw i:nth-of-type(2){background:var(--ta)}
.thsw i:nth-of-type(3){background:var(--tt);opacity:.6}
.tabvis{display:flex;flex-wrap:wrap;gap:4px 16px}
.dlg-row{display:flex;flex-wrap:wrap;gap:6px}
dialog{max-height:88vh;overflow:auto}

/* ---------- v7: randomizer, checklists, note menu ---------- */
.rnd-grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:22px;align-items:start}
.formula{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-bottom:12px}
.formula select{grid-column:1/-1}
.formula:has(.ib) select{grid-column:1}
.formula input{min-width:0}
.deck-list{display:flex;flex-direction:column;gap:6px}
.deck{background:var(--card);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);padding:6px 8px}
.deck.off{opacity:.55}
.deck.drop-above{box-shadow:0 -3px 0 var(--soul),inset 0 0 0 1px var(--edge)}
.deck.drop-below{box-shadow:0 3px 0 var(--soul),inset 0 0 0 1px var(--edge)}
.deck-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center}
.deck-name{background:transparent;border:1px solid transparent;padding:3px 5px;font:500 15px var(--f-px);color:var(--bone);min-width:0}
.deck-name:hover{border-color:var(--edge)}.deck-name:focus{outline:none;border-color:var(--soul);background:var(--field-f)}
.stepper{display:inline-flex;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge)}
.stepper button{width:24px;height:26px;color:var(--muted);font-weight:600}
.stepper button:hover{background:var(--stone3);color:var(--text)}
.stepper input{width:34px;text-align:center;background:var(--field-f);border:0;font:600 13px var(--f-num);color:var(--text)}
.deck-meta{display:flex;align-items:center;gap:2px;margin-top:2px;padding-left:46px}
.deck-meta .sub{font-size:12px;color:var(--muted)}
.deck-items{width:100%;margin-top:6px;font:13px/1.45 var(--f-ui);resize:vertical}
.rollrow{display:flex;gap:8px;margin-bottom:12px}
.btn.roll{flex:1;justify-content:center;padding:12px;font:500 19px var(--f-px)}
.btn.roll svg{width:20px;height:20px;shape-rendering:crispEdges}
.btn.roll small{font:400 11px var(--f-ui);opacity:.7}
.btn.qmark{width:52px;font:600 24px var(--f-px)}
.hpos{min-width:38px;text-align:center;font-family:var(--f-num)}
.results{display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--well);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);min-height:80px}
.rg-head{display:flex;align-items:center;gap:6px;font:500 13px var(--f-px);color:var(--muted);margin-bottom:6px}
.rg-head .ib{width:24px;height:24px}
.toks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.results.column .toks{flex-direction:column;align-items:stretch}
.semi{color:var(--dim);font-family:var(--f-num)}
.tok{display:inline-flex;align-items:center;background:var(--card2);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge-hi)}
.tok.locked{box-shadow:inset 0 0 0 1px var(--near);background:#2a2516}
.tok.pop{animation:tokpop .35s steps(3) both}
@keyframes tokpop{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
.tt{padding:5px 10px;font:500 15px var(--f-ui);color:var(--text);text-align:left;flex:1}
.tt:hover{color:#fff;background:#ffffff0a}
.locked .tt{color:#ffe7b5;cursor:default}
.ti{display:grid;place-items:center;width:24px;height:30px;color:var(--dim)}
.ti:hover{color:var(--text);background:#ffffff0a}
.ti svg{width:13px;height:13px}
.ti[aria-pressed="true"]{color:var(--near)}
.mixacts{margin:12px 0 0}
.sndrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--edge)}
.sndrow .vol{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sndrow input[type=range]{width:100px;accent-color:var(--soul)}
.favs{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.favs .sub{font-size:12px;color:var(--muted)}
.fav{display:flex;gap:4px;align-items:center;background:var(--card);border:1px solid var(--edge)}
.fav-t{flex:1;text-align:left;padding:5px 8px;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-t:hover{background:#ffffff08}
.rich .todo{display:flex;gap:6px;align-items:flex-start}
.rich .cb{flex:none;width:15px;height:15px;margin-top:3px;border:2px solid var(--edge-hi);background:var(--sink);cursor:pointer;user-select:none}
.rich .cb[data-on="1"]{background:var(--soul);border-color:var(--soul);background-image:linear-gradient(135deg,transparent 45%,var(--soul-dark) 45%,var(--soul-dark) 60%,transparent 60%)}
.rich .todo:has(.cb[data-on="1"]){color:var(--dim);text-decoration:line-through}
.note{position:relative}
.nmenu{position:absolute;right:8px;top:36px;z-index:5;display:flex;flex-direction:column;min-width:190px;background:var(--stone2);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge-hi),0 10px 24px #000a;padding:4px}
.nmenu button{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13.5px;text-align:left;color:var(--text)}
.nmenu button:hover{background:var(--stone3)}
.nmenu button svg{width:15px;height:15px;color:var(--muted)}
.nmenu .danger{color:#ffb3b1}
.mqf{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
@media (max-width:1100px){ .rnd-grid{grid-template-columns:1fr} }

/* ---------- v6: sessions, tabs, categories ---------- */
.plate .rtabs{margin-left:auto;display:flex;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge)}
.rtab{display:flex;align-items:center;gap:6px;padding:4px 10px;font:500 13px var(--f-px);color:var(--muted)}
.rtab[aria-selected="true"]{background:var(--stone3);color:var(--bone)}
.rtab .live{width:6px;height:6px;background:var(--soul);box-shadow:0 0 6px var(--soul);animation:flicker .8s steps(2) infinite}
.miniline{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:6px 10px;background:var(--field);border:1px dashed var(--edge);font-size:12.5px;color:var(--muted);text-align:left}
.miniline:hover{border-color:var(--edge-hi);color:var(--text)}
.miniline b{font:600 13px var(--f-num);color:var(--text)}
.clock.sess .digits{color:#d9e4ff}
.clock.sess.ph-work.ss-running .digits{color:var(--soul-ink);text-shadow:0 3px 0 #000,0 0 18px color-mix(in srgb,var(--soul) 33%,transparent)}
.clock.sess.ph-break .digits,.clock.sess.ph-long .digits{color:#bcd3ff}
.sbar{width:100%;height:4px;background:#ffffff10;margin-top:8px}
.sbar i{display:block;height:100%;background:var(--soul);transition:width .25s linear}
.ph-break .sbar i,.ph-long .sbar i{background:var(--arcane)}
.candles{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:12px 0 2px;min-height:36px}
.cdl{width:18px;height:36px}
.cdl.burn{animation:flicker .45s steps(2) infinite}
.cdl.off{opacity:.7}
.ask{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0 0;padding:10px;background:var(--soul-bg);border:1px solid var(--soul-dim);text-align:center;font-size:13.5px}
.ask div{display:flex;gap:8px}
.slog{font-size:12px;color:var(--muted);margin:8px 0 0;text-align:center}
.sset-head{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--muted)}
.sset-head svg{width:14px;height:14px;transform:rotate(-90deg);transition:transform .15s}
.sset-head[aria-expanded="true"] svg{transform:none}
.sset{display:grid;gap:10px;margin-top:8px;padding:10px;background:var(--well);border:1px solid var(--edge)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sgrid label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.sgrid input{font-family:var(--f-num);padding:5px 8px}
.sflags{display:grid;gap:4px}
.sflag{display:flex;align-items:center;gap:8px;font-size:13px;text-align:left;padding:2px 0}
.sflag .box{width:16px;height:16px}
.chipx{margin-left:-6px;width:20px;height:30px;color:var(--dim);border:1px solid var(--edge);border-left:0}
.chipx:hover{color:var(--over)}
.addchip{display:inline-grid;place-items:center;width:30px;height:30px;border:1px dashed var(--edge);color:var(--muted)}
.addchip:hover{color:var(--text);border-color:var(--edge-hi)}
.addchip svg{width:14px;height:14px}
.catemo{width:44px;height:34px;font-size:19px;border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);background:var(--field)}
.catemo:hover,.catemo[aria-expanded="true"]{box-shadow:inset 0 0 0 1px var(--soul)}
.catrow{grid-template-columns:44px minmax(0,1fr) 80px auto!important}
.emopal{display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--sink);border:1px solid var(--edge);align-items:center}
.emopal button{width:30px;height:30px;font-size:17px}
.emopal button:hover{background:var(--stone3)}
.tab.drop-before{box-shadow:inset 3px 0 0 var(--soul),inset 0 0 0 1px var(--edge)}
.tab.drop-after{box-shadow:inset -3px 0 0 var(--soul),inset 0 0 0 1px var(--edge)}
.tab[draggable="true"]{cursor:pointer}

/* ---------- v5: rich notes, pins, report colours ---------- */
.rich{min-height:26px;padding:4px 6px;font:14px/1.5 var(--f-ui);color:var(--text);outline:none;overflow-wrap:anywhere;cursor:text}
.rich:focus{background:var(--field-f);box-shadow:inset 0 0 0 1px var(--edge)}
.rich:empty::before{content:attr(data-ph);color:var(--dim);pointer-events:none}
.rich ul,.rich ol{margin:4px 0;padding-left:22px}
.rich img{display:block;max-width:100%;max-height:260px;margin:6px 0;border:1px solid var(--edge);cursor:zoom-in}
.rich a{color:var(--arcane)}
.rtb{display:flex;gap:2px;opacity:.35;transition:opacity .15s;margin-bottom:2px}
.rich-wrap:hover .rtb,.rich-wrap:focus-within .rtb{opacity:1}
.rb{display:inline-grid;place-items:center;width:26px;height:24px;font:600 13px var(--f-ui);color:var(--muted);border:1px solid transparent}
.rb:hover{background:var(--stone3);color:var(--text)}
.rb[aria-pressed="true"]{background:var(--soul-bg);color:var(--soul);border-color:var(--soul-dim)}
.rb-italic{font-style:italic}.rb-underline{text-decoration:underline}.rb-strikeThrough{text-decoration:line-through}
.rb svg{width:15px;height:15px}
.composer .rich-wrap.comp{background:var(--field);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);padding:4px}
.comp .rich{min-height:48px}
.qnote{display:flex;flex-direction:column;gap:4px}.qnote .lbl{font-size:12px;color:var(--muted)}
.qnote .rich-wrap{background:var(--field);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);padding:4px}
.qnote .rich{min-height:56px}
.note.pinned{box-shadow:inset 0 0 0 1px #8a6a33}
.note .pin[aria-pressed="true"]{color:var(--near)}
.grip{cursor:grab;color:var(--dim);font-size:15px;line-height:1;padding:2px 3px;user-select:none}
.grip:hover{color:var(--text)}
.note.drop-before{box-shadow:-4px 0 0 0 var(--soul),inset 0 0 0 1px var(--edge)}
.note.drop-after{box-shadow:4px 0 0 0 var(--soul),inset 0 0 0 1px var(--edge)}
.notes-sec{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:2px 0 -2px}
.notes-sec svg{width:13px;height:13px}
dialog.wide{width:min(1100px,96vw)}
.lightbox{display:block;max-width:100%;max-height:78vh;margin:0 auto;image-rendering:auto}
.rr.tinted{box-shadow:inset 3px 0 0 var(--qc)}
.rep .rr.tinted .rn{color:var(--qc)}
.rep .rr.lvl2.tinted .rn{opacity:.8}

/* ---------- v4: colour, emoji, two-step buttons ---------- */
.q-row.tinted{box-shadow:inset 3px 0 0 var(--qc)}
.p-head.tinted{box-shadow:inset 4px 0 0 var(--qc)}
.q-row.tinted .name,.p-head.tinted .p-name{color:var(--qc)}
.q.done>.q-row.tinted .name{color:var(--dim)}
.emo{margin-right:6px;font-style:normal}
.look{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.look .lbl{font-size:12px;color:var(--muted)}
.look .swatches{flex-wrap:wrap}
.look .swatches button{width:20px;height:20px}
.look .swatches .nocol{background:repeating-linear-gradient(45deg,#3a4258 0 3px,var(--stone) 3px 6px)}
.emos{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.emos button{width:28px;height:28px;font-size:16px;border:1px solid transparent;color:var(--muted)}
.emos button:hover{background:var(--stone3)}
.emos button[aria-pressed="true"]{border-color:var(--soul);background:var(--soul-bg)}
.emo-in{width:62px;padding:4px 6px;margin-left:6px;text-align:center}
.btn.armed,.ib.armed{background:#5a1f24!important;color:#ffd6d4!important;box-shadow:inset 0 0 0 1px var(--over)!important}
.ib.armed{width:auto;padding:0 8px;font-size:12px;white-space:nowrap}
.goalset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--text)}
.goalset input{width:70px}
.goalset span{flex-basis:100%;font-size:12px;color:var(--muted)}
.rr{grid-template-columns:minmax(0,1fr) auto 28px 28px 28px!important}

/* ---------- v3: drag & drop, splitter, report, notes ---------- */
.tip{font-size:12px;color:var(--dim);margin:0 0 10px}
.chunk[draggable="true"]{cursor:grab}
.chunk-main{text-align:left;min-width:0}
.chunk.insplit{border-color:var(--arcane);background:#141a2c}
.drop-hi{box-shadow:inset 0 0 0 2px var(--soul),0 0 16px color-mix(in srgb,var(--soul) 27%,transparent)!important;background-color:var(--soul-bg)!important}
.is-dragging.drag-c .q-row{outline:1px dashed color-mix(in srgb,var(--soul) 33%,transparent);outline-offset:-2px}
.is-dragging.drag-q .chunk,.is-dragging.drag-q #strip{outline:1px dashed color-mix(in srgb,var(--soul) 53%,transparent);outline-offset:2px}
.is-dragging.drag-q #crypt,.is-dragging.drag-p #crypt{box-shadow:inset 0 0 0 1px var(--frost)}
.q.flash>.q-row{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--soul-dim)}to{background:transparent}}
.dragging{opacity:.45}
.splitter{border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--arcane);background:var(--well);padding:10px;margin-bottom:12px}
.sp-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sp-head b{font:700 18px var(--f-num);color:var(--soul)}
.sp-head span{font-size:12px;color:var(--muted)}
.splitter .strip{height:58px;margin-top:10px}
.splitter .hint{margin:14px 0 8px;font-size:12px}
.splitter .parts{max-height:none}
.splitter .part{grid-template-columns:12px 64px minmax(0,1fr) 28px;gap:6px}
.splitter .part input.min{width:64px;font-family:var(--f-num)}
.splitter .part select{min-width:0;width:100%}
.sp-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sp-foot .sum{flex:1;font-size:12px;color:var(--muted);min-width:120px}
.sg small{white-space:nowrap}
.p-head[draggable="true"]{cursor:grab}
.fp{font-weight:500;color:var(--frost)}
.noteic{display:inline-grid;place-items:center;width:18px;height:18px;color:var(--arcane);flex:none}
.noteic svg{width:14px;height:14px}
.edit label textarea{min-height:64px;resize:vertical;font:13.5px/1.45 var(--f-ui)}
.ib[disabled]{opacity:.3;pointer-events:none}
select.field option,select.catsel option{background:var(--card);color:var(--text)}
/* report */
.report-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:24px}
.dayname{font:500 13.5px var(--f-ui);color:var(--text);min-width:170px;text-align:center}
.rep{border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);background:var(--well)}
.rr{display:grid;grid-template-columns:minmax(0,1fr) auto 28px 28px;gap:4px;align-items:center;padding:4px 6px 4px 12px;border-bottom:1px solid #ffffff08}
.rr .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .rt{font:500 14px var(--f-num);text-align:right;min-width:76px;padding-right:4px}
.rr.lvl0{background:var(--card2);margin-top:0}.rr.lvl0 .rn{font:500 15px var(--f-px);color:var(--bone)}.rr.lvl0 .rt{color:var(--bone)}
.rr.lvl1 .rn{padding-left:12px}
.rr.lvl2 .rn{padding-left:30px;color:var(--muted);font-size:13px}.rr.lvl2 .rt{color:var(--muted);font-size:13px}
.rr.total{background:var(--soul-bg);border-top:2px solid var(--abyss)}.rr.total .rn{font:500 16px var(--f-px)}.rr.total .rt{color:var(--soul);font-size:16px;font-weight:700}
.rr.un .rn,.rr.un .rt{color:var(--dim)}
.calc-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 84px 28px;gap:6px;align-items:center}
.crow input{font:500 13.5px var(--f-num)}
.cres{font:500 13px var(--f-num);text-align:right;color:var(--muted)}
.crow.active input{box-shadow:inset 0 0 0 1px var(--arcane)}
.ctotal{display:flex;align-items:center;gap:8px;padding:12px;background:var(--soul-bg);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--soul-dim);margin-top:12px;flex-wrap:wrap}
.ctotal span{color:var(--muted)}.ctotal b{flex:1;font:700 17px var(--f-num);color:var(--soul);white-space:nowrap}
/* notes */
.composer{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:8px;align-items:start;margin-bottom:14px}
.composer>.btn{margin-top:28px}
.composer textarea{resize:vertical;min-height:42px;font:14px/1.45 var(--f-ui)}
.chips.wrap{flex-wrap:wrap}
.chips .cnt{font-size:11px;color:var(--dim);margin-left:2px}
.catman{border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);background:var(--well);padding:10px;display:grid;gap:6px;margin-bottom:14px}
.catrow{display:grid;grid-template-columns:64px minmax(0,1fr) 80px auto;gap:8px;align-items:center}
.catrow .sub{font-size:12px;color:var(--muted)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:6px;column-gap:10px;row-gap:0;align-items:start}
.note{background:var(--card);border:2px solid var(--abyss);box-shadow:inset 0 0 0 1px var(--edge);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.note-head{display:flex;align-items:center;gap:6px;min-width:0}
.catsel{background:transparent;border:1px solid var(--edge);padding:2px 4px;font-size:12.5px;color:var(--text);max-width:150px}
.ndate{font-size:11.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
.note-text{background:transparent;border:0;resize:none;color:var(--text);font:14px/1.5 var(--f-ui);padding:2px 4px;min-height:26px;overflow:hidden;width:100%}
.note-text:focus{outline:none;background:var(--field-f);box-shadow:inset 0 0 0 1px var(--edge)}
.qpath{font-size:12.5px;color:var(--frost);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:980px){
  .report-grid{grid-template-columns:1fr}
  .layout,.layout.swap{grid-template-columns:1fr;row-gap:18px}
  .colsplit{display:none}
  .layout.swap .left,.layout.swap .right{order:0}
  .left{position:static}
}
@media (max-width:640px){
  .layout{padding:12px 10px 50px}
  .top{padding:10px 12px;gap:8px}.today,.sync{display:none}
  .cols{display:none}
  .q-row,.p-head,.q.child>.q-row{grid-template-columns:22px minmax(0,1fr) auto auto}
  .q-row .num.total,.q-row .est,.p-head .num.total,.p-head .est{display:none}
  .edit .row,.grid4{grid-template-columns:1fr}
  .goal-add{grid-template-columns:64px 1fr}
  .composer{grid-template-columns:1fr}
  .catrow{grid-template-columns:64px 1fr auto}.catrow .sub{display:none}
  .part{grid-template-columns:14px 70px 1fr auto}.part .lab{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#nothing .sk,.st-paused .sk{display:block}}
</style>

<body>

  <div class="brand" id="brand"></div>
  <span class="today" id="today"></span>
  <button class="quote" id="quote" data-act="quote-next" title="Click for another phrase"></button><button class="ib" id="quoteEdit" data-act="quote-edit" aria-label="Edit phrases" title="Edit phrases"></button>
  <span class="sync" id="sync">Saved on this device</span>
  <button class="ib desk-only" data-act="mini-open" id="miniBtn" aria-label="Mini timer" title="Mini timer, always on top"></button>
  <button class="btn sm" data-act="undo" id="undoBtn" disabled title="Undo (Ctrl+Z)">Undo</button>
  <button class="ib" data-act="settings" aria-label="Settings" title="Settings" id="gear"></button>
</header>

<div class="layout" id="layout">

    <div class="panel" id="ritual">
      <div class="plate"><h2 id="ritualTitle" class="drag-h" draggable="true" data-drag="l:ritual" title="Drag to swap with the panel below">The Ritual</h2><div class="rtabs" id="rtabs" role="tablist" aria-label="Timer"></div></div>

  <section class="right">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="board"></div>
  </section>
</div>

<dialog id="dlg"><button class="dlg-x" data-act="dlg-close" aria-label="Close" title="Close (Esc)">×</button><div id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" data-act="undo">Undo</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="imgFile" accept="image/*" multiple hidden>
<input type="file" id="qFile" accept=".txt,text/plain" hidden>
<input type="file" id="txtFile" accept=".txt,text/plain" multiple hidden>

/* ================= pixel sprites ================= */

/* ================= theme layer (strings) ================= */

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const DAY = 864e5, MIN = 6e4;
const pad = n => String(n).padStart(2,'0');
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
function isoDay(d=new Date()){ d=new Date(d); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dayStart(ts=now()){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function endOfIso(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d,23,59,59,999).getTime(); }
function startOfIso(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).getTime(); }
function fmtClock(ms){ const s=Math.max(0,Math.floor(ms/1000)); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; }
function fmtHM(ms){ const m=Math.floor(Math.max(0,ms)/MIN), h=Math.floor(m/60); return h ? `${h}h ${pad(m%60)}m` : `${m}m`; }
function fmtTime(ts){ const d=new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); const o={day:'numeric',month:'short'}; if(y!==new Date().getFullYear()) o.year='numeric'; return new Date(y,m-1,d).toLocaleDateString('en-GB',o); }
function parseDur(s){
  s=String(s||'').trim().toLowerCase(); if(!s) return null; let m;
  if((m=s.match(/^(\d+):(\d{1,2})$/))) return +m[1]*60 + +m[2];
  let total=0, found=false;
  s.replace(/(\d+(?:[.,]\d+)?)\s*(h|hr|hrs|hours?|m|min|mins|minutes?)?/g,(x,n,u)=>{ found=true; n=parseFloat(n.replace(',','.')); total += (u && u[0]==='h') ? n*60 : n; return ''; });
  return found ? Math.round(total) : null;
}
/* rich text: whitelist sanitizer + plain-text helpers */
const RICH_OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,UL:1,OL:1,LI:1,BR:1,P:1,DIV:1,IMG:1,A:1,SPAN:1};
function sanitize(html){
  if(!html) return ''; const doc=new DOMParser().parseFromString(`<body>${html}</body>`,'text/html');
  const walk=node=>{ [...node.childNodes].forEach(ch=>{
    if(ch.nodeType===3) return; if(ch.nodeType!==1){ ch.remove(); return; }
    const tag=ch.tagName.toUpperCase();
    if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|LINK|META)$/.test(tag)){ ch.remove(); return; }
    walk(ch);
    if(!RICH_OK[tag] || (tag==='SPAN' && ch.getAttribute('class')!=='cb')){ ch.replaceWith(...ch.childNodes); return; }
    [...ch.attributes].forEach(a=>{ const n=a.name.toLowerCase();
      if(tag==='IMG' && n==='src' && /^(\/_blob\/|data:image\/(png|jpe?g|gif|webp);|https:)/i.test(a.value)) return;
      if(tag==='A' && n==='href' && /^https?:/i.test(a.value)) return;
      if(tag==='SPAN' && (n==='class' || (n==='data-on' && /^[01]$/.test(a.value)))) return;
      if(tag==='DIV' && n==='class' && a.value==='todo') return;
      ch.removeAttribute(a.name); });
    if(tag==='A'){ ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener'); }
    if(tag==='SPAN'){ ch.setAttribute('contenteditable','false'); if(!ch.hasAttribute('data-on')) ch.setAttribute('data-on','0'); ch.textContent=''; }
    if(tag==='IMG' && !ch.getAttribute('src')) ch.remove(); }); };
  walk(doc.body); return doc.body.innerHTML;
}
function textToHtml(t){ return esc(t||'').replace(/\n/g,'<br>'); }
function htmlToText(h){ if(!h) return ''; if(/class="cb"/.test(h)){ const t=new DOMParser().parseFromString(`<body>${h}</body>`,'text/html'); t.querySelectorAll('.cb').forEach(c=>c.replaceWith(c.getAttribute('data-on')==='1'?'[x] ':'[ ] ')); h=t.body.innerHTML; } const d=new DOMParser().parseFromString(`<body>${String(h).replace(/<br\s*\/?>/gi,'\n').replace(/<(div|p|li|ul|ol)\b/gi,'\n$&')}</body>`,'text/html'); return (d.body.textContent||'').replace(/\n{3,}/g,'\n\n').trim(); }
function firstGrapheme(s){ s=String(s||'').trim(); if(!s) return ''; try{ return [...new Intl.Segmenter().segment(s)][0]?.segment||''; }catch{ return [...s][0]||''; } }
const emo = o => o && o.emoji ? `<span class="emo">${esc(o.emoji)}</span>` : '';
const tint = o => o && o.color && QCOL[o.color] ? ` tinted" style="--qc:${QCOL[o.color]}` : '';
function lookRow(kind,o){ const key=kind+':'+o.id;
  return `<div class="look"><span class="lbl">Colour</span><div class="swatches">${['',...Object.keys(QCOL)].map(k=>`<button class="${k?'':'nocol'}" data-act="set-color" data-id="${key}" data-sub="${k}" aria-pressed="${(o.color||'')===k}" style="${k?`background:${QCOL[k]}`:''}" title="${k||'No colour'}" aria-label="${k||'No colour'}"></button>`).join('')}</div>
    <span class="lbl">Icon</span><div class="emos">${['',...EMO].map(e=>`<button data-act="set-emoji" data-id="${key}" data-sub="${e}" aria-pressed="${(o.emoji||'')===e}" title="${e?e:'No icon'}">${e||'·'}</button>`).join('')}<input class="field emo-in" data-k="${kind==='q'?'quest':'project'}" data-id="${o.id}" data-f="emoji" value="${esc(o.emoji||'')}" placeholder="any" aria-label="Any emoji" title="Paste any emoji"></div></div>`; }
function fmtEst(min){ if(!min) return ''; const h=Math.floor(min/60), m=min%60; return h ? (m?`${h}h${m}m`:`${h}h`) : `${m}m`; }

/* ================= state ================= */
const LS = 'taskromancer-v1';

function fresh(){
  return { v:1, updatedAt:0,
    timer:{ state:'idle', acc:0, runStart:null, segStart:null },
    pending:[], projects:[], quests:[], goals:[], notes:[], focus:null,
    cats:[{id:'idea',emoji:'💡',name:'Ideas'},{id:'work',emoji:'📌',name:'Work'},{id:'learn',emoji:'🧠',name:'Learning'},{id:'life',emoji:'🏠',name:'Personal'}],
    calc:['',''], dayTimed:{ day:'', ms:0 }, sess:sessDefaults(), rnd:rndDefaults(), quotes:{ active:'auto', lists:quoteDefaults() },
    stats:{ cuts:0, allocs:0, questsDone:0, since:now() },
    ui:{ tab:'board', q:'', hideDone:false, crypt:false, edit:null, goalSort:'deadline', goalIcon:'', openGoal:null,
         reportDay:'', decimal:false, dayGoal:8, noteCat:'', noteSort:'manual', manageCats:false, noteCatNew:'idea', noteQ:'', draft:'', ritualTab:'tracker', sessOpen:false, tabOrder:null, catPick:null, newCatEmoji:'⭐', deckEdit:null, noteMenu:null, theme:'necro', hiddenTabs:[], qEdit:null } };
}
function normalize(s){
  const b=fresh(); s = s && typeof s==='object' ? s : {};
  const o = Object.assign(b, s);
  o.timer = Object.assign(fresh().timer, s.timer||{}); o.ui = Object.assign(fresh().ui, s.ui||{}); o.stats = Object.assign(fresh().stats, s.stats||{});
  ['pending','projects','quests','goals','notes','cats','calc'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=fresh()[k]; });
  if(!o.calc.length) o.calc=[''];
  if(!o.dayTimed || typeof o.dayTimed!=='object') o.dayTimed={ day:'', ms:0 };
  if(!Array.isArray(o.ui.hiddenTabs)) o.ui.hiddenTabs=[];
  if(!o.quotes || !Array.isArray(o.quotes.lists)) o.quotes={ active:'auto', lists:quoteDefaults() };
  { const d=sessDefaults(), x=s.sess||{}; o.sess=Object.assign(d,x); o.sess.cfg=Object.assign(sessDefaults().cfg,x.cfg||{}); o.sess.run=Object.assign(sessDefaults().run,x.run||{});
    if(!Array.isArray(o.sess.presets)) o.sess.presets=[]; if(!Array.isArray(o.sess.log)) o.sess.log=[]; }
  { const d=rndDefaults(); o.rnd=Object.assign(d, s.rnd||{}); ['decks','formulas','history','favs'].forEach(k=>{ if(!Array.isArray(o.rnd[k])) o.rnd[k]=[]; });
    if(!o.rnd.results || typeof o.rnd.results!=='object') o.rnd.results={}; o.rnd.decks.forEach(d=>{ if(!Array.isArray(d.items)) d.items=[]; d.amount=Math.max(1,+d.amount||1); if(d.active==null) d.active=true; }); }
  if((o.notesV||0)<2){ o.notes.forEach(n=>{ if(n.html==null) n.html=textToHtml(n.text||''); });
    o.quests.forEach(q=>{ if(q.note && !/<\/?(b|i|u|s|br|div|p|ul|li|img|strong|em)\b/i.test(q.note)) q.note=textToHtml(q.note); }); o.notesV=2; }
  [...o.notes].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach((n,i)=>{ if(typeof n.order!=='number') n.order=i; n.pinned=!!n.pinned; if(n.text==null) n.text=htmlToText(n.html); });
  o.quests.forEach(q=>{ q.days ||= {}; });
  o.goals.forEach(g=>{ g.items ||= []; g.icon ||= '💀'; g.colorMode ||= 'progress'; g.color ||= '#3b6fd6'; });
  return o;
}
let state;
try { state = normalize(JSON.parse(localStorage.getItem(LS))); } catch { state = fresh(); }

/* persistence: local first, then the person's private artifact storage, split in two parts so neither hits the size cap */
let refs=null, saveT=null, saving=false, again=false, pushed={ core:'', notes:'', rnd:'' };
const setSync = t => { $('#sync').textContent = t; };
function save(){ state.updatedAt=now(); try{ localStorage.setItem(LS, JSON.stringify(state)); }catch{} clearTimeout(saveT); saveT=setTimeout(push, 800); deskSave(); }
function splitState(){ const { notes, cats, rnd, ...core } = state; return { core:JSON.stringify(core), notes:JSON.stringify({ notes, cats }), rnd:JSON.stringify({ rnd }) }; }
async function push(){
  if(!refs) return; if(saving){ again=true; return; } saving=true; setSync('Saving…');
  try{ const p=splitState(), u=state.updatedAt;
    if(p.notes!==pushed.notes){ await refs.notes.set({ json:p.notes, updatedAt:u }); pushed.notes=p.notes; }
    if(p.rnd!==pushed.rnd){ await refs.rnd.set({ json:p.rnd, updatedAt:u }); pushed.rnd=p.rnd; }
    { await refs.core.set({ json:p.core, updatedAt:u }); pushed.core=p.core; }
    setSync('Synced'); }
  catch(e){ setSync(e?.code==='quota_exceeded' ? 'Too much data, export a backup' : 'Saved on this device'); }
  saving=false; if(again){ again=false; push(); }
}
(async()=>{
  try{
    if(!window.claude?.use) return;
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db||!user) return; const id = await user.id(); if(!id) return;
    refs = { core:db.doc(`data/users/${id}/core`), notes:db.doc(`data/users/${id}/notes`), rnd:db.doc(`data/users/${id}/rnd`) };
    const [c,n,rd,legacy] = await Promise.all([refs.core.get(), refs.notes.get(), refs.rnd.get(), db.doc(`data/users/${id}/taskromancer`).get()]);
    let remote=null, ru=0;
    if(c.exists){ const d=c.data(); remote=JSON.parse(d.json); ru=d.updatedAt||0; if(n.exists) Object.assign(remote, JSON.parse(n.data().json)); if(rd.exists) Object.assign(remote, JSON.parse(rd.data().json)); }
    else if(legacy.exists){ const d=legacy.data(); remote=JSON.parse(d.json); ru=d.updatedAt||0; }
    if(remote && ru > (state.updatedAt||0)){
      state=normalize(remote); state.updatedAt=ru; try{ localStorage.setItem(LS, JSON.stringify(state)); }catch{}
      renderAll(); if(c.exists){ pushed=splitState(); setSync('Synced'); } else push();
    } else push();
  }catch{}
})();

/* undo: one level, for destructive or bulk actions */
const UNDO_MAX=5; let undoStack=[];
function snap(){ undoStack.push(JSON.stringify(state)); if(undoStack.length>UNDO_MAX) undoStack.shift(); updUndo(); }
function updUndo(){ const b=$('#undoBtn'); if(!b) return; b.disabled=!undoStack.length; b.textContent = undoStack.length>1 ? `Undo · ${undoStack.length}` : 'Undo'; b.title=`Undo (Ctrl+Z), ${undoStack.length} of ${UNDO_MAX} steps saved`; }
function undo(){ if(!undoStack.length) return; const timer=state.timer, run=state.sess?.run; state=normalize(JSON.parse(undoStack.pop())); state.timer=timer; if(run) state.sess.run=run;
  updUndo(); hideToast(); commit(); toast(undoStack.length?`Undone, ${undoStack.length} more step${undoStack.length>1?'s':''} available`:'Undone'); }

/* ================= domain ================= */
const today = () => isoDay();
const Q = id => state.quests.find(q=>q.id===id);
const P = id => state.projects.find(p=>p.id===id);
const kids = q => state.quests.filter(c=>c.parentId===q.id);
const tops = pid => state.quests.filter(q=>q.projectId===pid && !q.parentId);
const ownTotal = q => Object.values(q.days).reduce((a,b)=>a+b,0);
const qTotal = q => ownTotal(q) + kids(q).reduce((a,c)=>a+qTotal(c),0);
const qToday = q => (q.days[today()]||0) + kids(q).reduce((a,c)=>a+qToday(c),0);
function estState(spent, estMin){
  if(!estMin) return { cls:'none', text:'no estimate', r:0 };
  const est=estMin*MIN, r=spent/est, d=est-spent;
  return { cls: r>1?'over':r>=.8?'near':'ok', r, text: d>=0 ? `${fmtHM(d)} left` : `${fmtHM(-d)} over` };
}
function questLabel(q){ const p=P(q.projectId); const par=q.parentId?Q(q.parentId):null; return [p?.name, par?.title, q.title].filter(Boolean).join(' › '); }

/* timer */
const elapsed = () => state.timer.acc + (state.timer.state==='running' ? now()-state.timer.runStart : 0);
function play(){ const t=state.timer; if(t.state==='running') return; t.runStart=now(); if(!t.segStart) t.segStart=now(); t.state='running'; commit(); }
function pause(){ const t=state.timer; if(t.state!=='running') return; t.acc+=now()-t.runStart; t.runStart=null; t.state='paused'; commit(); }
const timedToday = () => (state.dayTimed.day===today() ? state.dayTimed.ms : 0) + (state.timer.state!=='idle' ? elapsed() : 0);
const dayGoalH = () => Math.max(1, +state.ui.dayGoal || 8);
function cut(stopAfter){
  const t=state.timer, ms=elapsed(), end=now();
  if(ms>=1000){
    state.pending.push({ id:uid(), ms, start:t.segStart||end-ms, end, day:isoDay(t.segStart||end-ms) });
    if(state.dayTimed.day!==today()) state.dayTimed={ day:today(), ms:0 };
    state.dayTimed.ms += ms;
    state.stats.cuts++; floaty(`+${ms<MIN?Math.round(ms/1000)+'s':fmtHM(ms)} harvested`);
  } else if(!stopAfter){ toast('Nothing to cut yet'); return; }
  t.acc=0;
  if(stopAfter || t.state!=='running'){ t.state = stopAfter ? 'idle' : t.state; t.runStart=null; t.segStart=null; if(t.state==='paused' && !stopAfter){ /* stays paused at zero */ } }
  else { t.runStart=end; t.segStart=end; }
  commit();
}

/* ================= randomizer (from Retro Token Mixer) ================= */
function rndDefaults(){ return { decks:[], results:{}, layout:'line', formulas:[], history:[], hpos:-1, favs:[], sound:'generate_dice', volume:.55, muted:false, sep:'; ', noOverlap:true, curFormula:'' }; }
const R = () => state.rnd;
const RND_SOUNDS=[['generate_dice','🎲 Dice roll'],['generate_arcade_block','🧱 Arcade block'],['generate_cash_register','🛒 Cash register'],['generate_soft_chime','✨ Soft chime'],['generate_arcade_confirm','🟢 Arcade confirm']];
function sfx(key){ const r=R(); if(r.muted) return; try{ const a=new Audio(SFX[key]); a.volume=clamp(+r.volume||0); a.play().catch(()=>{}); }catch{} }
const D = id => R().decks.find(d=>d.id===id);
const activeDecks = () => R().decks.filter(d=>d.active!==false);
const WORD_RE=/[\p{L}\p{N}'’-]+/gu;
const wordsOf = t => new Set((t.toLowerCase().match(WORD_RE)||[]));
const same = (a,b) => a.trim().toLowerCase()===b.trim().toLowerCase();
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function conflicts(c, toks){ if(toks.some(x=>same(x.t,c))) return true; if(!R().noOverlap) return false; const w=wordsOf(c); return toks.some(x=>[...wordsOf(x.t)].some(y=>w.has(y))); }
function pickToken(deck, others){
  const items=shuffle([...deck.items]);
  for(const it of items) if(!conflicts(it,others)) return it;
  for(const it of items) if(!others.some(x=>same(x.t,it))) return it;
  return null;
}
function parseTokens(text){ return String(text||'').split(/[,\n\r]+/).map(x=>x.trim()).filter(Boolean); }
function rollDeck(d){
  const cur=R().results[d.id]||[], n=Math.max(d.amount, cur.filter(x=>x.locked).length);
  const slots=[]; for(let i=0;i<n;i++) slots.push(cur[i]&&cur[i].locked ? cur[i] : null);
  cur.forEach((x,i)=>{ if(i>=n && x.locked) slots.push(x); });
  for(let i=0;i<slots.length;i++){ if(slots[i]) continue; const c=pickToken(d, slots.filter(Boolean)); slots[i] = c==null ? null : { t:c, locked:false }; }
  R().results[d.id]=slots.filter(Boolean);
}
function pushHistory(){ const r=R(); r.history=r.history.slice(0, r.hpos+1); r.history.push({ at:now(), results:JSON.parse(JSON.stringify(r.results)) }); if(r.history.length>30) r.history.shift(); r.hpos=r.history.length-1; }
function rollAll(silent, refreshed){
  if(DESK && !refreshed && R().decks.some(d=>d.path && d.active!==false)){ refreshLinkedDecks().then(()=>rollAll(silent,true)); return true; }
  const ds=activeDecks(); if(!ds.length){ sfx('missing'); toast('Add a deck and tick it to roll'); return false; }
  ds.forEach(rollDeck); pushHistory(); if(!silent) sfx(R().sound); commit(); flashMix(); if(DESK && R().imgAuto && R().imgFolder) randomImage(); return true;
}
function flashMix(){ document.querySelectorAll('.tok').forEach((el,i)=>{ el.style.animationDelay=(i*25)+'ms'; el.classList.add('pop'); }); }
function rerollTok(did,i){ const d=D(did), list=R().results[did]; if(!d||!list||!list[i]||list[i].locked) return;
  const c=pickToken(d, list.filter((_,k)=>k!==i)); if(c==null){ sfx('missing'); toast('No clean alternative left in this deck'); return; }
  list[i]={ t:c, locked:false }; pushHistory(); sfx(R().sound); commit(); }
function addTok(did){ const d=D(did); if(!d) return; const list=R().results[did]||(R().results[did]=[]);
  const c=pickToken(d, list); if(c==null){ sfx('missing'); toast('No clean extra token left in this deck'); return; }
  list.push({ t:c, locked:false }); d.amount=list.length; pushHistory(); sfx(R().sound); commit(); }
const tokText = t => t.replace(/-/g,' ');
function mixText(sep){ sep=sep??R().sep; return activeDecks().flatMap(d=>(R().results[d.id]||[]).map(x=>tokText(x.t))).join(sep); }
function mixGroups(){ return activeDecks().map(d=>({ d, toks:R().results[d.id]||[] })).filter(g=>g.toks.length); }
async function importTxt(files){
  let added=0; const wasReload=!!rndReload;
  for(const f of files){
    const buf=await f.arrayBuffer(); let text;
    try{ text=new TextDecoder('utf-8',{ fatal:true }).decode(buf); }catch{ text=new TextDecoder('windows-1251').decode(buf); }
    const items=parseTokens(text.replace(/^\uFEFF/,''));
    if(!items.length){ sfx('missing'); toast(`“${f.name}” has no tokens`); continue; }
    if(rndReload){ const d=D(rndReload); if(d){ d.items=items; toast(`Reloaded “${d.name}”: ${items.length} tokens`); } rndReload=null; added++; continue; }
    R().decks.push({ id:uid(), name:f.name.replace(/\.txt$/i,''), items, amount:1, active:true }); added++;
  }
  if(added){ commit(); if(!wasReload) toast(`${added} deck${added>1?'s':''} imported`); }
}

function loadFormula(f){

}

function linkOn(){ const r=state.sess.run; if(!state.sess.cfg.link) return;
  if(state.timer.state==='idle'){ r.startedTracker=true; play(); } else if(state.timer.state==='paused' && r.startedTracker) play(); }
function linkOff(stop){ const r=state.sess.run; if(!r.startedTracker || state.timer.state==='idle') { if(stop) r.startedTracker=false; return; }
  if(stop){ cut(true); r.startedTracker=false; } else if(state.timer.state==='running') pause(); }
function sessToggle(){ const r=state.sess.run;
  if(r.state==='running'){ r.remaining=r.endsAt-now(); r.endsAt=null; r.state='paused'; if(r.phase==='work') linkOff(false); commit(); return; }
  if(!sessActive()){ r.phase='work'; r.round=1; r.total=phaseLen('work'); r.remaining=r.total; r.ask=false; }
  r.endsAt=now()+r.remaining; r.state='running'; if(r.phase==='work') linkOn(); commit(); }
function sessAdvance(skipped){
  const r=state.sess.run, c=state.sess.cfg; if(!skipped) sessSound();
  if(r.phase==='work'){ linkOff(true); if(c.ask && !skipped){ r.ask=true; state.ui.ritualTab='sessions'; }
    if(r.round>=c.rounds){ r.phase='done'; r.state='idle'; r.endsAt=null; r.remaining=0; toast(`All ${c.rounds} rounds done. The ritual is complete.`); deskNotify(T.ritual, `All ${c.rounds} rounds done. Nice work.`); commit(); return; }
    r.phase = c.longEvery && c.longBrk && r.round%c.longEvery===0 ? 'long' : (c.brk ? 'break' : 'work');
    if(r.phase==='work') r.round++; }
  else { r.phase='work'; r.round++; }
  r.total=phaseLen(r.phase); r.remaining=r.total;
  if(c.auto){ r.endsAt=now()+r.remaining; r.state='running'; if(r.phase==='work') linkOn(); } else { r.state='paused'; r.endsAt=null; }
  const msg = r.phase==='work' ? `Round ${r.round} of ${c.rounds} begins` : `${r.phase==='long'?'Long break':'Break'}, ${fmtHM(r.total)}`;
  toast(msg); if(!skipped) deskNotify(T.ritual, msg); commit();
}

function viewSessions(){
  const S_=state.sess, r=S_.run, c=S_.cfg, active=sessActive(), left=active?sessLeft():c.work*MIN;

      <button class="ctl" data-act="sess-reset" ${r.phase==='idle'?'disabled':''} title="Reset to round 1">${PX.stop}Reset<small>to round 1</small></button>
      <button class="ctl main" data-act="sess-toggle" title="Start / pause (Space)">${r.state==='running'?PX.pause+'Pause':PX.play+(r.state==='paused'?'Resume':'Start')}<small>space</small></button>

    </div>

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch{ try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch{ return false; } }
}

// A theme is one pack: palette, flavour words, a pixel scene (base → minions → target) and a "day is done" sky.
const SKEL_MAX=16, SKEL_EVERY=15*MIN;
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); }
function mixHex(a,b,t){ const A=hexRgb(a), B=hexRgb(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function themeVars(c){
  return { night:c.bg, stone:c.stone, stone2:c.stone2, stone3:c.stone3, edge:c.edge, 'edge-hi':c.edgeHi, abyss:c.abyss,
    text:c.text, muted:c.muted, dim:c.dim, soul:c.soul, arcane:c.arcane, bone:c.bone, ok:c.ok||'#6fcf8e', near:c.near||'#e3b25a', over:c.over||'#e0605e',
    field:mixHex(c.stone,c.abyss,.45), well:mixHex(c.stone,c.abyss,.35), 'field-f':mixHex(c.bg,c.abyss,.3), card:mixHex(c.stone,c.bg,.5), card2:mixHex(c.stone2,c.stone,.5), sink:mixHex(c.abyss,c.bg,.5),
    'soul-bg':mixHex(c.stone,c.soul,.12), 'soul-btn':mixHex(c.stone,c.soul,.28), 'soul-btn-h':mixHex(c.stone,c.soul,.36), 'soul-dim':mixHex(c.stone,c.soul,.45),
    'soul-ink':mixHex(c.soul,'#ffffff',.72), 'soul-dark':mixHex(c.soul,'#000000',.78), 'stone-h':mixHex(c.stone3,c.edgeHi,.35), head1:mixHex(c.stone2,c.edgeHi,.14),
    topbar:mixHex(c.bg,c.abyss,.5)+'cc', frost:c.frost, 'frost-dim':mixHex(c.bg,c.frost,.3), crypt1:mixHex(c.bg,c.frost,.07), crypt2:mixHex(c.bg,c.frost,.03),
    glow1:c.glow1, glow2:c.glow2, 'rest-ink':c.restInk||'#f6dcc0' };
}
const skyG = (id,stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
const STARS=[[12,8],[40,12],[58,6],[77,10],[96,7],[110,15],[146,11],[150,20],[24,18],[88,19],[120,6],[66,16],[134,17],[6,14]];
const starsSvg = (cls,col='#c9d4ff') => `<g class="${cls}">${STARS.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="${col}" opacity=".8"/>`).join('')}</g>`;
const SUN = (y='#e8954e',Y='#ffc56a',W='#fff1c4') => pix(["...yyy...",".yyYYYyy.",".yYYYYYy.","yYYWWYYYy","yYYWYYYYy","yYYYYYYYy",".yYYYYYy.",".yyYYYyy.","...yyy..."],{y,Y,W});
const MOON = () => pix([".mmm.","mmmMm","mmmmm","mMmmm",".mmm."],{m:'#e6ecff',M:'#b9c3e6'});
const R1 = (x,y,w,h,f,extra='') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
// minions: lanes of sprites walking from → to; spacing is random within limits, so they come in clumps and gaps
function minionsSvg(th){
  const MAXV=th.max||SKEL_MAX, lanes=th.lanes, L=lanes.length, per=Math.ceil(MAXV/L), dur=th.dur||19, layers=lanes.map(()=>''), cum=lanes.map(()=>0);
  for(let i=0;i<MAXV;i++){
    const li=i%L, ln=lanes[li]; if(i>=L) cum[li]+=dur/per*(.25+Math.random()*1.5);
    const spr=typeof ln.sprite==='function'?ln.sprite(i):ln.sprite, dx=ln.to-ln.from, flip=dx<0, d=dur*(.8+Math.random()*.45);
    layers[li]+=`<g class="sk" data-i="${i}" style="--dx:${dx}px;animation-duration:${d.toFixed(2)}s;animation-delay:-${(cum[li]%d).toFixed(2)}s;visibility:hidden"><g class="bob" style="animation-delay:-${(Math.random()*.5).toFixed(2)}s"><g transform="translate(${flip?ln.from+ln.w:ln.from} ${ln.y})${flip?' scale(-1 1)':''}">${spr}</g></g></g>`;
  }
  return layers.join('');
}

function goalTimes(g){ const start=g.start||now(), end=endOfIso(g.deadline); const frac = end<=start?1:clamp((now()-start)/(end-start)); return { start, end, frac, daysLeft:Math.ceil((end-now())/DAY)-1, over:now()>end }; }
function goalProgress(g){ const n=g.items.length, d=g.items.filter(i=>i.done).length; return { n, d, p:n?d/n:0 }; }
function goalColor(g){
  if(g.colorMode==='neutral') return '#4f566a'; if(g.colorMode==='custom') return g.color;
  const {p}=goalProgress(g); const hue = p<.5 ? p*2*55 : 55+(p-.5)*2*75; return `hsl(${hue.toFixed(0)} ${p<.5?66:58}% ${p<.5?42:40}%)`;
}

/* ================= split editor (inline, in the harvest panel) ================= */
let A=null; // { ids, total, day, cuts:[], assign:[], active }
function openSplit(ids, qid){
  const chunks = state.pending.filter(c=>ids.includes(c.id)); if(!chunks.length) return;
  const total = chunks.reduce((a,c)=>a+c.ms,0);
  A = { ids:chunks.map(c=>c.id), total, day:chunks.map(c=>c.day).sort()[0], cuts:[], assign:[qid||''], active:0 };
  renderHarvest();
}
const bounds = () => [0, ...A.cuts, A.total];
const segs = () => { const b=bounds(); return b.slice(0,-1).map((s,i)=>({ start:s, ms:b[i+1]-s })); };
const liveQuest = q => q && !q.frozen && !P(q.projectId)?.frozen && !(q.parentId && Q(q.parentId)?.frozen);
function questOptions(sel){
  let h=`<option value="">Unallocated</option>`;
  state.projects.filter(p=>!p.frozen).forEach(p=>{ const qs=tops(p.id).filter(q=>!q.frozen); if(!qs.length) return;
    h+=`<optgroup label="${esc(p.name)}">`;
    qs.forEach(q=>{ h+=`<option value="${q.id}" ${sel===q.id?'selected':''}>${q.done?'✓ ':''}${q.emoji?q.emoji+' ':''}${esc(q.title)}</option>`;
      kids(q).forEach(c=>{ h+=`<option value="${c.id}" ${sel===c.id?'selected':''}>\u00a0\u00a0› ${esc(c.title)}</option>`; }); });
    h+='</optgroup>'; });
  return h;
}
function splitEditor(){
  const S=segs(), f=state.focus&&Q(state.focus);
  return `<div class="splitter">
    <div class="sp-head"><b>${fmtClock(A.total)}</b><span>${Math.floor(A.total/MIN)} whole min to share</span><button class="ib" data-act="split-cancel" aria-label="Close splitter" style="margin-left:auto">${IC.x}</button></div>
    <div class="strip" id="strip">${S.map((s,i)=>segHtml(s,i)).join('')}${A.cuts.map((c,i)=>`<div class="hd" data-h="${i}" style="left:${c/A.total*100}%"><span class="x" data-act="cut-del" data-id="${i}" title="Remove divider">×</span><span class="tip">${fmtHM(c)}</span></div>`).join('')}</div>
    <p class="hint">Drag quests from the board onto this bar, dropping where that quest’s share should start. Drag dividers to adjust, double-click to add one, <kbd>Shift</kbd> snaps to 5 min.</p>
    <div class="parts">${S.map((s,i)=>`<div class="part ${A.active===i?'active':''}">
      <span class="sw" style="background:${A.assign[i]?PART_COLORS[i%PART_COLORS.length]:'#2a3042'}"></span>
      <input class="field min" type="number" min="1" data-pmin="${i}" value="${Math.floor(s.ms/MIN)}" aria-label="Minutes for part ${i+1}" ${S.length<2?'disabled':''}>
      <select class="field" data-passign="${i}" aria-label="Quest for part ${i+1}">${questOptions(A.assign[i])}</select>
      <button class="ib" data-act="part-split" data-id="${i}" title="Split this part in half" aria-label="Split part">${PX.cut}</button>
    </div>`).join('')}</div>
    <div class="sp-foot"><span class="sum" id="asum"></span>
      ${f && liveQuest(f) ? `<button class="btn sm" data-act="split-focus" title="Give every part to the focus quest">All to focus</button>` : ''}
      <button class="btn sm" data-act="split-cancel">Cancel</button><button class="btn sm soul" data-act="split-apply">Allocate</button></div>
  </div>`;
}
function segHtml(s,i){
  const q=A.assign[i]&&Q(A.assign[i]);
  return `<div class="sg ${q?'':'un'} ${A.active===i?'active':''}" data-sg="${i}" style="left:${s.start/A.total*100}%;width:${s.ms/A.total*100}%;background:${PART_COLORS[i%PART_COLORS.length]}" title="${fmtClock(s.ms)}${q?' → '+esc(q.title):''}"><b>${Math.floor(s.ms/MIN)}m</b><small>${q?esc(q.title):'drop a quest'}</small></div>`;
}
function updateAllocDom(){
  const S=segs();
  document.querySelectorAll('#strip .sg').forEach((el,i)=>{ const s=S[i]; el.style.left=s.start/A.total*100+'%'; el.style.width=s.ms/A.total*100+'%'; el.querySelector('b').textContent=Math.floor(s.ms/MIN)+'m'; });
  document.querySelectorAll('#strip .hd').forEach((el,i)=>{ el.style.left=A.cuts[i]/A.total*100+'%'; el.querySelector('.tip').textContent=fmtHM(A.cuts[i]); });
  document.querySelectorAll('[data-pmin]').forEach((el,i)=>{ if(document.activeElement!==el) el.value=Math.floor(S[i].ms/MIN); });
  updateSum();
}
function updateSum(){
  const el=$('#asum'); if(!el||!A) return; const S=segs(); let on=0, un=0; const qs=new Set();
  S.forEach((s,i)=>{ if(A.assign[i]){ on+=s.ms; qs.add(A.assign[i]); } else un+=s.ms; });
  el.textContent = on ? `${fmtHM(on)} to ${qs.size} quest${qs.size>1?'s':''}${un?`, ${fmtHM(un)} stays harvested`:''}` : 'Drop a quest on the bar';
}
function addCut(at){
  at=Math.round(at/MIN)*MIN; const b=bounds();
  if(at<=0 || at>=A.total) return false;
  for(let i=0;i<b.length-1;i++){ if(at>b[i] && at<b[i+1]){ if(at-b[i]<MIN || b[i+1]-at<MIN) return false;
    A.cuts.splice(i,0,at); A.assign.splice(i+1,0,''); A.active=i+1; return true; } }
  return false;
}
function dropOnStrip(qid, frac){
  const pos=frac*A.total, b=bounds();
  let i=b.findIndex((x,k)=>k<b.length-1 && pos>=x && pos<=b[k+1]); if(i<0) i=A.assign.length-1;
  if(!A.assign[i] || A.assign[i]===qid) { A.assign[i]=qid; A.active=i; }
  else if(addCut(pos)) A.assign[A.active]=qid;
  else { A.assign[i]=qid; A.active=i; }
  renderHarvest();
}
function applySplit(){
  const S=segs(); if(!A.assign.some(Boolean)){ toast('Drop a quest on the bar first'); return; }
  snap();
  const chunks = state.pending.filter(c=>A.ids.includes(c.id)), first=chunks.reduce((a,c)=>Math.min(a,c.start),Infinity);
  let count=0, ms=0;
  S.forEach((s,i)=>{ const q=A.assign[i]&&Q(A.assign[i]);
    if(q){ q.days[A.day]=(q.days[A.day]||0)+s.ms; count++; ms+=s.ms; }
    else state.pending.push({ id:uid(), ms:s.ms, start:first+s.start, end:first+s.start+s.ms, day:A.day }); });
  state.pending = state.pending.filter(c=>!A.ids.includes(c.id)).sort((a,b)=>a.start-b.start);
  state.stats.allocs++; A=null; selChunks.clear(); commit();
  toast(`Allocated ${fmtHM(ms)} in ${count} part${count>1?'s':''}`, true);
}
function giveChunk(cid, qid){
  const c=state.pending.find(x=>x.id===cid), q=Q(qid); if(!c||!liveQuest(q)) return;
  snap(); q.days[c.day]=(q.days[c.day]||0)+c.ms; state.pending=state.pending.filter(x=>x!==c);
  if(A && A.ids.includes(cid)) A=null; state.stats.allocs++; commit();
  toast(`${fmtHM(c.ms)} → ${q.title}`, true);
  const row=document.querySelector(`[data-qbox="${qid}"]`); if(row){ row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'),1300); }
}
// column splitter
let colDrag=null;
