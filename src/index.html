document.addEventListener('pointermove', e=>{ if(!colDrag) return; const r=colDrag.r, pad=20; let w = state.ui.swap ? (r.right-pad-e.clientX-5) : (e.clientX-r.left-pad-5);
  w=Math.round(clamp(w,300,Math.max(320,Math.min(760,r.width-560)))); state.ui.leftW=w; $('#layout').style.setProperty('--lw',w+'px'); layoutNotes?.(); });
document.addEventListener('pointerup', ()=>{ if(!colDrag) return; colDrag=null; $('#splitter').classList.remove('active'); save(); });
document.addEventListener('dblclick', e=>{ if(e.target.closest?.('#splitter')){ state.ui.leftW=400; applyLayout(); save(); } });
// divider dragging
let hdrag=null;
document.addEventListener('pointerdown', e=>{
  const h=e.target.closest('.hd'); if(!h || e.target.closest('.x')) return;
  hdrag={ i:+h.dataset.h, el:h, strip:$('#strip') }; h.classList.add('drag'); h.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(!hdrag) return; const r=hdrag.strip.getBoundingClientRect(), step=e.shiftKey?5*MIN:MIN;
  const at=Math.round(clamp((e.clientX-r.left)/r.width)*A.total/step)*step;
  const lo=(A.cuts[hdrag.i-1]??0)+MIN, hi=(A.cuts[hdrag.i+1]??A.total)-MIN; if(lo>hi) return;
  A.cuts[hdrag.i]=clamp(at,lo,hi); updateAllocDom();
});
document.addEventListener('pointerup', ()=>{ if(hdrag){ hdrag.el.classList.remove('drag'); hdrag=null; } });
document.addEventListener('dblclick', e=>{
  const st=e.target.closest('#strip'); if(!st || e.target.closest('.hd')) return;
  const r=st.getBoundingClientRect(); if(addCut((e.clientX-r.left)/r.width*A.total)) renderHarvest(); else toast('Parts can’t be shorter than a minute');
});

/* ================= report + calculator ================= */
const qDay = (q,d) => (q.days[d]||0) + kids(q).reduce((a,c)=>a+qDay(c,d),0);
const fmtDec = ms => (ms/3600000).toFixed(2)+'h';
const tv = ms => state.ui.decimal ? fmtDec(ms) : fmtHM(ms);
function reportData(d){
  const rows=[]; let total=0;
  state.projects.forEach(p=>{ const qs=tops(p.id).filter(q=>qDay(q,d)>0); if(!qs.length) return;
    const pt=qs.reduce((a,q)=>a+qDay(q,d),0); total+=pt;
    rows.push({ p, ms:pt, quests:qs.map(q=>({ q, ms:qDay(q,d), kids:kids(q).filter(c=>qDay(c,d)>0).map(c=>({ q:c, ms:qDay(c,d) })) })) }); });
  return { rows, total, un: state.pending.filter(c=>c.day===d).reduce((a,c)=>a+c.ms,0) };
}
function reportText(d){
  const R=reportData(d), [y,m,dd]=d.split('-');
  let out=`DAILY REPORT — ${dd}.${m}.${y}\n`;
  R.rows.forEach(r=>{ out+=`\nPROJECT: ${r.p.name} — ${tv(r.ms)}\n`;
    r.quests.forEach(x=>{ out+=`  ${x.q.title} — ${tv(x.ms)}${x.q.done?' ✓':''}\n`; x.kids.forEach(k=>{ out+=`    ${k.q.title} — ${tv(k.ms)}\n`; }); }); });
  out+=`\nTOTAL: ${tv(R.total)}\n`; if(R.un) out+=`Not allocated yet: ${tv(R.un)}\n`;
  return out;
}
function reportCsv(d){
  const R=reportData(d), q=s=>`"${String(s).replace(/"/g,'""')}"`; let out='Date,Project,Quest,Objective,Minutes,Hours\n';
  const line=(p,qq,o,ms)=>{ out+=[d,q(p),q(qq),q(o),Math.floor(ms/MIN),(ms/3600000).toFixed(2)].join(',')+'\n'; };
  R.rows.forEach(r=>r.quests.forEach(x=>{ const own=x.q.days[d]||0; if(own) line(r.p.name,x.q.title,'',own); x.kids.forEach(k=>line(r.p.name,x.q.title,k.q.title,k.ms)); }));
  return out;
}

let calcActive=0;
function calcRow(s){
  s=String(s||'').replace(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/g,(m,a,b,c,d)=>{ let x=(+c*60 + +d)-(+a*60 + +b); if(x<0) x+=1440; return ` ${x}m `; });
  let total=0, ok=false, bad=false;
  (s.match(/[+\-−]?[^+\-−]+/g)||[]).forEach(t=>{ let sign=1; t=t.trim(); if(/^[-−]/.test(t)){ sign=-1; t=t.slice(1); } else if(t[0]==='+') t=t.slice(1); t=t.trim(); if(!t) return;
    const v=parseDur(t); if(v==null){ bad=true; return; } ok=true; total+=sign*v; });
  return ok ? { min:total, bad } : null;
}
function fmtMinS(min){ const neg=min<0; min=Math.abs(Math.round(min)); const h=Math.floor(min/60), m=min%60; return (neg?'−':'')+(h?`${h}h ${pad(m)}m`:`${m}m`); }
function calcResText(r){ if(!String(r).trim()) return ''; const v=calcRow(r); return v ? fmtMinS(v.min)+(v.bad?' ?':'') : '?'; }
const calcTotal = () => state.calc.reduce((a,r)=>{ const v=calcRow(r); return a+(v?v.min:0); },0);
const calcTotalText = () => { const t=calcTotal(); return `${fmtMinS(t)} (${(t/60).toFixed(2)}h)`; };
function viewCalc(){
  return `<div class="plate"><h2>${T.calc}</h2></div>
  <p class="hint">Add and subtract time on each line, like <kbd>3h40m + 14m</kbd>, <kbd>9:00-12:15</kbd> or <kbd>90m - 1h</kbd>. The <b>+</b> and <b>−</b> next to report values add or subtract them in the active line.</p>
  <div class="calc-rows">${state.calc.map((r,i)=>`<div class="crow ${i===calcActive?'active':''}"><input class="field" data-calc="${i}" value="${esc(r)}" placeholder="e.g. 9:00-12:15 or 3h40m" autocomplete="off" aria-label="Line ${i+1}"><span class="cres" data-cres="${i}">${calcResText(r)}</span><button class="ib" data-act="calc-del" data-id="${i}" aria-label="Remove line">${IC.x}</button></div>`).join('')}</div>
  <div class="toolbar"><button class="btn sm" data-act="calc-add">${IC.plus}Add line</button><button class="btn sm" data-act="calc-clear">Clear</button></div>
  <div class="ctotal"><span>Total</span><b id="ctot">${calcTotalText()}</b><button class="btn sm" data-act="calc-copy" data-id="hm" title="Copy as hours and minutes">${IC.copy}h m</button><button class="btn sm" data-act="calc-copy" data-id="dec" title="Copy as decimal hours">${IC.copy}0.00h</button></div>`;
}

function noteSortFn(){
  const ci=id=>{ const i=state.cats.findIndex(c=>c.id===id); return i<0?999:i; };
  const sorts={ manual:(a,b)=>a.order-b.order, new:(a,b)=>b.createdAt-a.createdAt, old:(a,b)=>a.createdAt-b.createdAt,
    cat:(a,b)=>ci(a.cat)-ci(b.cat)||a.order-b.order, az:(a,b)=>(a.text||'').localeCompare(b.text||'') };
  return sorts[state.ui.noteSort]||sorts.manual;
}
function notesSorted(all){
  const ui=state.ui, q=(ui.noteQ||'').toLowerCase().trim();

function parseQuestInput(s){ const m=s.match(/^(.*?)(?:\s+(\d+(?:[.,]\d+)?\s*h(?:\s*\d+\s*m)?|\d+\s*m|\d+:\d{2}))\s*$/i); return m ? { title:m[1].trim(), est:parseDur(m[2]) } : { title:s.trim(), est:null }; }

// two-step button: the first click arms it, the second one acts (browser confirm dialogs are blocked here)
function arm(el, label){ if(el.dataset.armed==='1') return true; el.dataset.armed='1'; const orig=el.innerHTML; el.classList.add('armed'); el.textContent=label;
  setTimeout(()=>{ if(el.isConnected && el.dataset.armed==='1'){ el.dataset.armed=''; el.innerHTML=orig; el.classList.remove('armed'); } },3500); return false; }
function freeze(id, on){ const q=Q(id); if(!q||q.parentId) return; snap(); q.frozen=on; if(on && (state.focus===id || kids(q).some(c=>c.id===state.focus))) state.focus=null; if(on) state.ui.edit=null; commit(); toast(on?`“${q.title}” sent to ${T.crypt}`:`“${q.title}” revived`); }
function freezeProject(id, on){ const p=P(id); if(!p) return; snap(); p.frozen=on; if(on){ const f=state.focus&&Q(state.focus); if(f && f.projectId===id) state.focus=null; state.ui.edit=null; } commit(); toast(on?`Project “${p.name}” sent to ${T.crypt}`:`Project “${p.name}” revived`); }
function shiftDay(n){ const d=new Date(startOfIso(state.ui.reportDay||today())); d.setDate(d.getDate()+n); const iso=isoDay(d); state.ui.reportDay = iso>=today() ? '' : iso; commit(); }
async function saveFile(name, data, type){
  if(DESK){ try{ if(await tinvoke('save_dialog',{ name, text:String(data) })) toast(`Saved ${name}`); }catch(e){ toast('Could not save: '+e); } return; }
  try{ const dl = window.claude?.use ? await claude.use('downloads') : null; if(dl){ await dl.save({ filename:name, data }); toast(`Saved ${name}`); return; } }
  catch(e){ if(e?.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }catch{ toast('Could not save the file'); }
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='noop') return; // let links open
  const fn=A_[el.dataset.act]||DESK_ACTIONS[el.dataset.act]; if(fn){ e.preventDefault(); fn(el, el.dataset.id, el.dataset.sub, e); }
});
document.addEventListener('click', e=>{ const dl=$('#dlg'); if(!dl.open || e.target!==dl) return; const r=dl.getBoundingClientRect();
  if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) dl.close(); });
document.addEventListener('submit', e=>{ e.preventDefault(); FORMS[e.target.dataset.form]?.(e.target); });
document.addEventListener('focusin', e=>{ const c=e.target.dataset?.calc; if(c!==undefined){ calcActive=+c; document.querySelectorAll('.crow').forEach((r,i)=>r.classList.toggle('active',i===calcActive)); } });

  const o = k==='quest'?Q(id):k==='project'?P(id):G(id); if(!o) return;
  if(f==='est'){ o.est = parseDur(v) || null; return; }
  if(f==='emoji'){ o.emoji = firstGrapheme(v); return; }
  if(f==='startIso'){ if(v) o.start=startOfIso(v); return; }
  if((f==='title'||f==='name') && !v.trim()) return;
  if(f==='deadline' && !v) return;
  if(f==='jira'){ v=v.trim(); if(v && !/^https?:\/\//i.test(v)) v='https://'+v; }
  o[f]=v;
}

document.addEventListener('change', e=>{

  if(d.pmin!==undefined){ const i=+d.pmin, S=segs(), want=Math.max(1,Math.round(+el.value||1))*MIN;

  if(el.id==='mqProject'){ mq.pid=el.value; const nw=$('#mqNew'); if(nw){ nw.style.display = el.value==='__new' ? '' : 'none'; if(el.value==='__new') nw.focus(); } return; }

// A field's change event fires on blur, i.e. while the mouse is already pressing the next button.

let pDown=false, pendingCommit=false;
function softCommit(){ if(pDown){ pendingCommit=true; save(); } else commit(); }
document.addEventListener('pointerdown', ()=>{ pDown=true; }, true);
document.addEventListener('pointerup', ()=>{ pDown=false; if(pendingCommit){ pendingCommit=false; setTimeout(commit,0); } }, true);
document.addEventListener('keydown', e=>{
  if(e.key==='F11' && DESK){ e.preventDefault(); tinvoke('toggle_fullscreen'); return; }
  const ae=document.activeElement, typing=/^(INPUT|TEXTAREA|SELECT)$/.test(ae?.tagName) || !!ae?.isContentEditable;
  if(ae?.classList?.contains('rich')){
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && ae.dataset.rich==='composer'){ e.preventDefault(); A_['note-add'](); return; }
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey) && e.shiftKey && (k==='x')){ e.preventDefault(); richCmd(ae,'strikeThrough'); return; }
    if((e.ctrlKey||e.metaKey) && e.shiftKey && e.code==='Digit9'){ e.preventDefault(); toggleTodo(ae); return; }
    if((e.ctrlKey||e.metaKey) && e.shiftKey && (e.code==='Digit8'||k==='l')){ e.preventDefault(); richCmd(ae,'insertUnorderedList'); return; }
  }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && ae?.closest('[data-form="note-add"]')){ e.preventDefault(); ae.closest('form').requestSubmit(); return; }
  if(e.key==='Enter' && ae?.dataset.calc!==undefined){ e.preventDefault(); const i=+ae.dataset.calc; state.calc.splice(i+1,0,''); calcActive=i+1; commit(); document.querySelector(`[data-calc="${i+1}"]`)?.focus(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !typing){ e.preventDefault(); undo(); return; }
  if(e.key==='Enter' && ae?.id==='mqNew'){ e.preventDefault(); makeQuests(); return; }
  if(e.key==='Enter' && ae?.id==='formulaName'){ e.preventDefault(); A_['formula-save'](); return; }
  if(e.key==='Escape' && state.ui.noteMenu){ closeMenu(); return; }
  if(e.key==='Enter' && ae?.id==='newCat'){ e.preventDefault(); A_['cat-add'](); return; }
  if(e.key==='Enter' && ae?.id==='presetName'){ e.preventDefault(); A_['sess-preset-save'](); return; }
  if(e.key==='Escape'){ if(typing){ ae.blur(); return; } if(A){ A=null; renderHarvest(); return; } }
  if(typing || e.ctrlKey || e.metaKey || e.altKey || $('#dlg').open) return;
  const k=e.key.toLowerCase();
  if(e.code==='Space'){ e.preventDefault(); rtab()==='sessions' ? sessToggle() : A_.toggle(); }
  else if(k==='c' || k==='с'){ if(state.timer.state!=='idle') cut(false); }
  else if(k==='s' || k==='і' || k==='ы'){ if(state.timer.state!=='idle') cut(true); }
  else if(k==='a' || k==='ф'){ if(state.pending.length) openSplit(state.pending.map(c=>c.id)); }
  else if((k==='r' || k==='к') && state.ui.tab==='rnd'){ rollAll(); }
});

let imgTarget=null;
function richChanged(ed){
  if(ed.innerHTML==='<br>' || ed.innerHTML==='<div><br></div>') ed.innerHTML='';
  const key=ed.dataset.rich||'', h=ed.innerHTML;
  if(key==='composer'){ state.ui.draft=h; }
  else if(key.startsWith('note:')){ const n=state.notes.find(x=>x.id===key.slice(5)); if(!n) return; n.html=h; n.text=htmlToText(h); n.updatedAt=now(); }
  else if(key.startsWith('quest:')){ const q=Q(key.slice(6)); if(!q) return; q.note=h; }
  save();
}
// Chrome drops the caret at the start of the line after list commands, so we put it back where it was
function caretOffset(ed){ const s=getSelection(); if(!s.rangeCount) return null; const r=s.getRangeAt(0); if(!ed.contains(r.endContainer)) return null;
  const pre=r.cloneRange(); pre.selectNodeContents(ed); pre.setEnd(r.endContainer, r.endOffset); return { len:pre.toString().length, collapsed:r.collapsed }; }
function setCaretOffset(ed, off){ const w=document.createTreeWalker(ed, NodeFilter.SHOW_TEXT); let n, left=off;
  while((n=w.nextNode())){ if(left<=n.length){ const r=document.createRange(); r.setStart(n,left); r.collapse(true); const s=getSelection(); s.removeAllRanges(); s.addRange(r); return; } left-=n.length; } caretToEnd(ed); }
function richCmd(ed, cmd){ const o=caretOffset(ed); document.execCommand(cmd,false,null); if(o && o.collapsed && /List$/.test(cmd)) setCaretOffset(ed,o.len); richChanged(ed); updateRtb(); }
function caretToEnd(ed){ const r=document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function selRangeIn(ed){ const s=getSelection(); if(s.rangeCount && ed.contains(s.getRangeAt(0).startContainer)) return s.getRangeAt(0).cloneRange(); return null; }
function updateRtb(){
  const ed=document.activeElement; if(!ed?.classList?.contains('rich')) return;
  ed.closest('.rich-wrap')?.querySelectorAll('.rb[data-sub]').forEach(b=>{ let on=false; try{ on=document.queryCommandState(b.dataset.sub); }catch{} b.setAttribute('aria-pressed', on); });
}

async function compressImage(blob, max){
  if(blob.type==='image/gif' && blob.size<2e6) return blob;
  let bmp; try{ bmp=await createImageBitmap(blob); }catch{ return blob; }
  const sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
  if(sc===1 && blob.size<350e3) return blob;
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||blob),'image/webp',.85));
}
let warnedInline=false;
async function storeImage(file){
  const big=await compressImage(file,1600);
  if(DESK) return await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(big); });
  try{ const a = window.claude?.use ? await claude.use('assets') : null; if(a){ const r=await a.upload(big); return r.url; } }
  catch(e){ toast(`Image upload failed (${e?.code||'error'}), keeping a smaller copy inside the note`); }
  const small=await compressImage(file,900);
  if(!warnedInline){ warnedInline=true; toast('Images are kept inside the note on this device'); }
  return await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(small); });
}
async function insertImages(files, ed, range){
  files=[...files].filter(f=>f.type.startsWith('image/')); if(!files.length||!ed) return;
  toast(files.length>1?`Adding ${files.length} images…`:'Adding image…');
  for(const f of files){
    const url=await storeImage(f); if(!ed.isConnected) return;
    ed.focus(); const s=getSelection(); s.removeAllRanges(); if(range) s.addRange(range); else caretToEnd(ed);
    document.execCommand('insertHTML', false, `<img src="${esc(url)}" alt="">`); range=null; richChanged(ed);
  }
  hideToast();
}

function reorderNote(id, tid, before){

/* checklists inside rich text: a line is <div class="todo"><span class="cb" data-on="0|1"></span>text</div> */
const makeCb = () => { const c=document.createElement('span'); c.className='cb'; c.setAttribute('contenteditable','false'); c.setAttribute('data-on','0'); return c; };
function blockOf(node, ed){ while(node && node!==ed){ if(node.nodeType===1 && /^(DIV|P|LI)$/.test(node.tagName)) return node; node=node.parentNode; } return null; }
function caretAfterCb(block){ const cb=block.querySelector(':scope>.cb'); const r=document.createRange(); if(cb && cb.nextSibling){ r.setStart(cb.nextSibling.nodeType===3?cb.nextSibling:block, cb.nextSibling.nodeType===3?0:[...block.childNodes].indexOf(cb)+1); } else r.setStart(block, block.childNodes.length); r.collapse(true); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function toggleTodo(ed){
  const s=getSelection(); if(!s.rangeCount || !ed.contains(s.anchorNode)) caretToEnd(ed);
  let block=blockOf(getSelection().anchorNode, ed);
  if(!block){ document.execCommand('formatBlock', false, 'div'); block=blockOf(getSelection().anchorNode, ed); }
  if(!block){ const d=document.createElement('div'); d.appendChild(document.createElement('br')); ed.appendChild(d); block=d; }
  if(block.classList.contains('todo')){ block.classList.remove('todo'); if(!block.className) block.removeAttribute('class'); block.querySelector(':scope>.cb')?.remove(); }
  else { block.classList.add('todo'); if(!block.querySelector(':scope>.cb')){ block.insertBefore(makeCb(), block.firstChild); if(block.childNodes.length===1) block.appendChild(document.createElement('br')); } caretAfterCb(block); }
  richChanged(ed);
}
function todoAfterEnter(ed){
  const block=blockOf(getSelection().anchorNode, ed); if(!block) return; const prev=block.previousElementSibling;
  if(!prev || !prev.classList.contains('todo')) { if(block.classList.contains('todo') && !block.querySelector(':scope>.cb')){ block.classList.remove('todo'); } return; }
  const prevEmpty = !(prev.textContent||'').trim() && !prev.querySelector('img');
  if(prevEmpty){ prev.classList.remove('todo'); prev.querySelector(':scope>.cb')?.remove(); if(!prev.className) prev.removeAttribute('class'); block.classList.remove('todo'); block.querySelector(':scope>.cb')?.remove(); if(!block.className) block.removeAttribute('class'); prev.remove(); return; }
  block.classList.add('todo'); const cb=block.querySelector(':scope>.cb'); if(cb && cb!==block.firstChild) cb.remove();
  if(!block.querySelector(':scope>.cb')) block.insertBefore(makeCb(), block.firstChild); block.querySelector(':scope>.cb').setAttribute('data-on','0'); caretAfterCb(block);
}

// c:chunk → quest row (give all) · q:quest → chunk (open splitter) / strip (add share) / crypt (freeze) · p:project → crypt · frozen → board (revive)
let dragging=null;
function dropTarget(node){
  if(!dragging || !node?.closest) return null; const {kind,id}=dragging;
  if(kind==='c'){ const r=node.closest('.q-row[data-qid]'); return r && liveQuest(Q(r.dataset.qid)) ? { el:r, type:'give', id:r.dataset.qid } : null; }
  if(kind==='q'){ const q=Q(id); if(!q) return null;
    if(liveQuest(q)){
      const st=node.closest('#strip'); if(st) return { el:st, type:'strip' };
      const ch=node.closest('.chunk[data-cid]'); if(ch) return { el:ch, type:'chunk', id:ch.dataset.cid };
      const cr=node.closest('#crypt'); if(cr && !q.parentId) return { el:cr, type:'freeze' };
    } else { const bd=node.closest('#boardDrop'); if(bd && q.frozen && !P(q.projectId)?.frozen) return { el:bd, type:'thaw' }; }
  }
  if(kind==='l'){ const pn=node.closest('#ritual,#harvest'); return pn && pn.id!==id ? { el:pn, type:'panel', id:pn.id } : null; }
  if(kind==='d'){ const dk=node.closest('.deck[data-did]'); return dk && dk.dataset.did!==id ? { el:dk, type:'deck', id:dk.dataset.did } : null; }
  if(kind==='t'){ const tb=node.closest('.tab[data-id]'); return tb && tb.dataset.id!==id ? { el:tb, type:'tab', id:tb.dataset.id } : null; }
  if(kind==='n'){ const card=node.closest('.note[data-nid]'); return card && card.dataset.nid!==id ? { el:card, type:'note', id:card.dataset.nid } : null; }
  if(kind==='p'){ const p=P(id); if(!p) return null;
    const cr=node.closest('#crypt'); if(cr && !p.frozen) return { el:cr, type:'pfreeze' };
    const bd=node.closest('#boardDrop'); if(bd && p.frozen) return { el:bd, type:'pthaw' }; }
  return null;
}
const clearHi = () => document.querySelectorAll('.drop-hi,.drop-before,.drop-after,.drop-above,.drop-below').forEach(x=>x.classList.remove('drop-hi','drop-before','drop-after','drop-above','drop-below'));
document.addEventListener('dragstart', e=>{
  const el=e.target.closest?.('[data-drag]'); if(!el) return;
  const [kind,id]=el.dataset.drag.split(':'); dragging={kind,id};
  e.dataTransfer.effectAllowed='copyMove'; e.dataTransfer.setData('text/plain', kind==='q'?Q(id)?.title||'':kind==='p'?P(id)?.name||'':kind==='n'||kind==='t'||kind==='d'||kind==='l'?'':'time'); if(kind==='n'){ const card=el.closest('.note'); try{ e.dataTransfer.setDragImage(card,20,20); }catch{} }
  el.closest('.q,.chunk,.frozen,.project,.note,.deck')?.classList.add('dragging');
  document.body.classList.add('is-dragging', 'drag-'+kind);
});
document.addEventListener('dragend', ()=>{ dragging=null; clearHi(); document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); document.body.classList.remove('is-dragging','drag-c','drag-q','drag-p','drag-n','drag-t','drag-d','drag-l'); });
document.addEventListener('dragover', e=>{ const t=dropTarget(e.target); clearHi(); if(t){ e.preventDefault(); e.dataTransfer.dropEffect = t.type==='give'||t.type==='strip'||t.type==='chunk' ? 'copy' : 'move'; if(t.type==='note'||t.type==='tab'){ const r=t.el.getBoundingClientRect(); t.el.classList.add(e.clientX<r.left+r.width/2?'drop-before':'drop-after'); }
  else if(t.type==='panel'){ const o=state.ui.leftOrder||['ritual','harvest']; state.ui.leftOrder=[...o].reverse(); commit(); }
  else if(t.type==='deck'){ const r=t.el.getBoundingClientRect(); t.el.classList.add(e.clientY<r.top+r.height/2?'drop-above':'drop-below'); } else t.el.classList.add('drop-hi'); }
  else if(!dragging && e.dataTransfer?.types?.includes('Files') && e.target.closest?.('.rich')) e.preventDefault(); });
document.addEventListener('drop', e=>{
  if(!dragging){ const ed=e.target.closest?.('.rich'); const files=[...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith('image/'));
    if(ed && files.length){ e.preventDefault(); const r=document.caretRangeFromPoint?.(e.clientX,e.clientY); insertImages(files, ed, r && ed.contains(r.startContainer) ? r : null); } return; }
  const t=dropTarget(e.target); if(!t) return; e.preventDefault(); const {id}=dragging; clearHi();
  if(t.type==='give') giveChunk(id, t.id);
  else if(t.type==='chunk') openSplit([t.id], id);
  else if(t.type==='strip'){ const r=t.el.getBoundingClientRect(); dropOnStrip(id, clamp((e.clientX-r.left)/r.width)); }
  else if(t.type==='freeze') freeze(id,true);
  else if(t.type==='thaw') freeze(id,false);
  else if(t.type==='pfreeze') freezeProject(id,true);
  else if(t.type==='pthaw') freezeProject(id,false);
  else if(t.type==='note'){ const r=t.el.getBoundingClientRect(); reorderNote(id, t.id, e.clientX<r.left+r.width/2); }
  else if(t.type==='deck'){ const r=t.el.getBoundingClientRect(), ds=R().decks, dd=D(id); ds.splice(ds.indexOf(dd),1); ds.splice(ds.indexOf(D(t.id))+(e.clientY<r.top+r.height/2?0:1),0,dd); R().curFormula=''; commit(); }
  else if(t.type==='tab'){ const r=t.el.getBoundingClientRect(), o=tabOrder(true).filter(k=>k!==id); o.splice(o.indexOf(t.id)+(e.clientX<r.left+r.width/2?0:1),0,id); state.ui.tabOrder=o; commit(); }
  dragging=null;
});

let lastClock='', lastS='', ticks=0;
function tick(){
  ticks++;
  const r=state.sess.run;
  if(r.state==='running' && r.endsAt<=now()){ sessAdvance(false); return; }
  const c=fmtClock(elapsed()), sc=fmtClock(sessActive()?sessLeft():state.sess.cfg.work*MIN);
  if(c!==lastClock || sc!==lastS){ lastClock=c; lastS=sc;
    const d=$('#digits'); if(d) d.textContent=c; const sd=$('#sdigits'); if(sd) sd.textContent=sc;
    document.querySelectorAll('[data-live-trk]').forEach(x=>x.textContent=c); document.querySelectorAll('[data-live-sess]').forEach(x=>x.textContent=sc);
    const bar=$('#sbar'); if(bar && sessActive() && r.total) bar.style.width=((1-clamp(sessLeft()/r.total))*100).toFixed(2)+'%';
    updateScene();
    const f=state.focus&&Q(state.focus);
    document.title = state.timer.state==='running' ? `${c}${f?' · '+f.title:''}` : r.state==='running' ? `${sc} · ${r.phase==='work'?'Work':'Break'}` : state.timer.state==='paused' ? `Paused ${c}` : 'Taskromancer'; }
  if(DESK && ticks%2===0) pushMini();
