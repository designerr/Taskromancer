<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taskromancer mini</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#222839}
  body{font:13px "Rubik",system-ui,sans-serif;color:var(--text,#dfe3ee);user-select:none;cursor:default}
  .w{height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 10px;background:var(--bg,#222839);border:2px solid #080a12;box-shadow:inset 0 0 0 1px var(--edge,#363e57)}
  .row{display:flex;align-items:center;gap:6px;min-width:0}
  .clock{flex:1;font:700 27px "JetBrains Mono",ui-monospace,monospace;letter-spacing:-.01em}
  .run .clock{color:var(--soul,#6ee7a8)}
  button{all:unset;cursor:pointer;display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--edge,#363e57);color:var(--text,#dfe3ee);font-size:13px}
  button:hover{border-color:var(--soul,#6ee7a8);color:var(--soul,#6ee7a8)}
  .sub{flex:1;min-width:0;font-size:11.5px;color:var(--muted,#8d95ad);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="w" id="w" data-tauri-drag-region>
  <div class="row" data-tauri-drag-region>
    <span class="clock" id="clock" data-tauri-drag-region>00:00:00</span>
    <button id="toggle" title="Play / pause">▶</button>
    <button id="cut" title="Cut: harvest the time and keep going">✂</button>
    <button id="show" title="Open Taskromancer">⤢</button>
    <button id="close" title="Close the mini timer">×</button>
  </div>
  <div class="row" data-tauri-drag-region><span class="sub" id="sub" data-tauri-drag-region>Drag me anywhere</span></div>
</div>
<script>
  const T = window.__TAURI__, $ = id => document.getElementById(id);
  T.event.listen('mini-state', e => {
    const d = e.payload, r = document.documentElement.style;
    r.setProperty('--bg', d.bg); r.setProperty('--edge', d.edge); r.setProperty('--soul', d.soul); r.setProperty('--text', d.text); r.setProperty('--muted', d.muted);
    $('clock').textContent = d.clock;
    $('w').classList.toggle('run', d.st === 'running');
    $('toggle').textContent = d.st === 'running' ? '❚❚' : '▶';
    $('sub').textContent = d.s ? `${d.s.phase === 'work' ? 'Work' : 'Break'} ${d.s.clock}, round ${d.s.round}/${d.s.rounds}${d.focus ? ', ' + d.focus : ''}` : (d.focus || d.title);
  });
  ['toggle', 'cut', 'show'].forEach(id => $(id).addEventListener('click', () => T.event.emit('mini-cmd', id)));
  $('close').addEventListener('click', () => T.core.invoke('close_mini'));
  T.event.emit('mini-ready');
</script>
</body>
</html>
